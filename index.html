<script>
/* ============================================================
 * news.js —— 重要新闻：实时拉取 + 多源自动降级 + 可爱加载/失败态
 * 数据源配置：assets/js/data.js 的 WB.NEWS_FEEDS
 * 关键逻辑：
 *   1. 每个分类配置若干候选 RSS 源，先走 rss2json（JSON 通道），全部失败再走公共代理解析 XML；
 *   2. 若某个源能返回内容但最新一条已超过 freshDays 天（源站停更），自动降级到下一个新鲜源；
 *   3. 每次刷新页面都重新请求（带 _t 时间戳，防止浏览器/中间层缓存），结果只存内存不落本地；
 *   4. 所有源都不可用 → 显示可爱的降级卡片，并提供真实站点入口（百度新闻 / 新浪财经 / 36氪）。
 * ============================================================ */
(function () {
  var TIMEOUT = 7000;          // 单个源超时（毫秒）
  var cache = {};              // { catId: {state:'loading'|'ok'|'error', items:[], error:''} }
  var running = {};            // 防止同一分类重复请求

  WB.newsState = { cat: 'politics', lastAt: '' };

  /* ---------------- 网络请求（带超时） ---------------- */
  function req(url) {
    return new Promise(function (res, rej) {
      var timer, ctrl = null;
      if (typeof AbortController === 'function') ctrl = new AbortController();
      timer = setTimeout(function () { if (ctrl) ctrl.abort(); rej(new Error('请求超时')); }, TIMEOUT);
      var opt = ctrl ? { signal: ctrl.signal } : undefined;
      fetch(url, opt)
        .then(function (r) {
          clearTimeout(timer);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (j) { clearTimeout(timer); res(j); })
        .catch(function (e) { clearTimeout(timer); rej(e); });
    });
  }

  /* ---------------- 时间处理 ---------------- */
  function toDate(s) {
    if (!s) return null;
    var d = new Date(String(s).replace(/-/g, '/').replace('T', ' '));
    return isNaN(d) ? null : d;
  }
  /* 今天显示 今天 HH:MM，否则 MM-DD HH:MM */
  function niceTime(s) {
    var d = toDate(s);
    if (!d) return String(s || '').slice(0, 16);
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    var now = new Date();
    var sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    return sameDay
      ? '今天 ' + p(d.getHours()) + ':' + p(d.getMinutes())
      : p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  /* 列表中最新的那条距今多少天；无法判断返回 -1 */
  function freshness(items) {
    var newest = 0;
    (items || []).forEach(function (it) {
      var d = toDate(it.raw);
      if (d && d.getTime() > newest) newest = d.getTime();
    });
    return newest ? (Date.now() - newest) / 86400000 : -1;
  }
  function strip(html) {
    return String(html || '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
  }

  /* ---------------- 通道一：RSS2JSON 转 JSON ---------------- */
  function viaApi(rssUrl) {
    /* 免费版不支持 count 等附加参数，条数在前端截取 */
    var url = WB.RSS2JSON + '?rss_url=' + encodeURIComponent(rssUrl) +
      (WB.RSS2JSON_KEY ? '&api_key=' + encodeURIComponent(WB.RSS2JSON_KEY) : '') +
      '&_t=' + Date.now();
    return req(url).then(function (j) {
      if (!j || j.status !== 'ok') throw new Error((j && j.message) || '接口返回异常');
      return (j.items || []).slice(0, 10).map(function (it) {
        return {
          title: strip(it.title),
          link: it.link || '',
          source: '',
          time: niceTime(it.pubDate),
          raw: it.pubDate || '',
          desc: strip(it.description || it.content).slice(0, 90)
        };
      }).filter(function (x) { return x.title; });
    });
  }

  /* ---------------- 通道二：公共代理取 RSS 原文后解析 XML ---------------- */
  function viaProxy(rssUrl) {
    var url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rssUrl) + '&_t=' + Date.now();
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('代理通道 HTTP ' + r.status);
      return r.text();
    }).then(function (txt) {
      var doc = new DOMParser().parseFromString(txt, 'text/xml');
      if (doc.querySelector('parsererror')) throw new Error('源站返回不是有效 RSS');
      var nodes = doc.querySelectorAll('item, entry');
      if (!nodes.length) throw new Error('未解析到新闻条目');
      var out = [];
      for (var i = 0; i < Math.min(10, nodes.length); i++) {
        var it = nodes[i];
        function pick() {
          var arr = Array.prototype.slice.call(arguments).map(function (sel) {
            var el = it.querySelector(sel);
            return el ? el.textContent : '';
          }).filter(Boolean);
          return arr[0] || '';
        }
        var link = pick('link');
        if (!link) {
          var le = it.querySelector('link');
          link = le ? (le.getAttribute('href') || '') : '';
        }
        var raw = pick('pubDate', 'published', 'updated', 'date');
        out.push({
          title: strip(pick('title')),
          link: link,
          source: '',
          time: niceTime(raw),
          raw: raw,
          desc: strip(pick('description', 'summary', 'content')).slice(0, 90)
        });
      }
      return out.filter(function (x) { return x.title; });
    });
  }

  /* ---------------- 对外：拉取某个分类 ---------------- */
  WB.newsFetch = function (catId, force) {
    var feed = null;
    WB.NEWS_FEEDS.forEach(function (f) { if (f.id === catId) feed = f; });
    if (!feed) return Promise.reject(new Error('未配置该分类'));
    if (!force && cache[catId] && (cache[catId].state === 'ok' || cache[catId].state === 'loading')) {
      return Promise.resolve(cache[catId]);
    }
    if (running[catId]) return running[catId];

    cache[catId] = { state: 'loading', items: [], error: '' };

    var sources = (feed.sources && feed.sources.length)
      ? feed.sources
      : [{ url: feed.rss, name: feed.sourceName }];
    var limit = feed.freshDays || 7;        // 源站停更超过该天数就降级
    var best = null, firstOk = null, lastErr = null;

    /* 依次尝试；拿到「足够新鲜」的内容就停止，否则继续下一个源 */
    function runList(fn, idx) {
      if (idx >= sources.length) return Promise.resolve();
      var s = sources[idx];
      return fn(s.url)
        .then(function (items) {
          if (!items.length) throw new Error('该源暂无内容');
          var res = { items: items, name: s.name, age: freshness(items) };
          if (!firstOk) firstOk = res;
          if (res.age >= 0 && res.age <= limit) {
            if (!best || res.age < best.age) best = res;
            if (best === res) return 'stop';
          }
          return 'next';
        })
        .catch(function (err) { lastErr = err; return 'next'; })
        .then(function (r) {
          if (r === 'stop' && best) return;
          return runList(fn, idx + 1);
        });
    }

    var p = runList(viaApi, 0)
      .then(function () { return best ? null : runList(viaProxy, 0); })
      .then(function () {
        var result = best || firstOk;
        if (!result) throw lastErr || new Error('全部源均不可用');
        result.items.forEach(function (it) { it.source = result.name; });
        cache[catId] = { state: 'ok', items: result.items, error: '' };
        WB.newsState.lastAt = new Date().toTimeString().slice(0, 5);
        return cache[catId];
      })
      .catch(function (err) {
        cache[catId] = { state: 'error', items: [], error: (err && err.message) || '未知错误' };
        return cache[catId];
      })
      .then(function (res) { running[catId] = null; return res; });

    running[catId] = p;
    return p;
  };

  /* ---------------- 顶部三枚粉色胶囊分类标签 ---------------- */
  WB.newsTabsHTML = function () {
    return '<div class="news-tabs">' + WB.NEWS_FEEDS.map(function (f) {
      return '<button class="news-tab' + (WB.newsState.cat === f.id ? ' on' : '') + '" ' +
        'data-act="news-tab" data-cat="' + f.id + '">' +
        '<span class="nt-ico">' + f.ico + '</span>' + f.name + '</button>';
    }).join('') + '</div>';
  };

  /* ---------------- 列表区（加载中 / 成功 / 失败） ---------------- */
  WB.newsListHTML = function (catId) {
    var c = cache[catId];
    if (!c || c.state === 'loading') {
      return '<div class="news-loading"><span class="bow">🎀</span><span>正在加载今日新闻 …</span></div>';
    }
    if (c.state === 'error') {
      var f = null;
      WB.NEWS_FEEDS.forEach(function (x) { if (x.id === catId) f = x; });
      return '<div class="news-fail">' +
        '<div class="nf-ico">🙈</div>' +
        '<div class="nf-t">哎呀，新闻加载失败了，稍后再试吧</div>' +
        '<div class="nf-d">（' + WB.esc(c.error) + '｜可能是网络不通或源站限制，也可以直接看下面的热点入口）</div>' +
        '<div class="nf-b">' +
          '<button class="btn" data-act="news-refresh">重试一下</button>' +
          '<a class="btn primary" href="' + WB.esc(f.fallback) + '" target="_blank" rel="noopener noreferrer">点击查看今日热点 →</a>' +
        '</div>' +
        '</div>';
    }
    var items = c.items;
    if (!items.length) return '<div class="empty">暂无内容</div>';
    return '<div class="news-list">' + items.map(function (it, i) {
      return '<div class="news-row">' +
        '<a class="news-item" href="' + WB.esc(it.link) + '" target="_blank" rel="noopener noreferrer">' +
        '<span class="n-idx">' + (i + 1) + '</span>' +
        '<div class="n-main">' +
          '<div class="n-title">' + WB.esc(it.title) + '</div>' +
          (it.desc ? '<div class="n-desc">' + WB.esc(it.desc) + '</div>' : '') +
          '<div class="n-meta"><span class="tag-pill">' + WB.esc(it.source || '资讯') + '</span>' +
            '<span class="n-time">' + WB.esc(it.time || '') + '</span></div>' +
        '</div>' +
        '<span class="n-go">↗</span>' +
        '</a>' +
        '<button class="n-save" data-act="save-news" data-cat="' + catId + '" data-i="' + i + '" title="存入我的新闻存档">存档</button>' +
        '</div>';
    }).join('') + '</div>';
  };

  /* 供「存档」按钮使用：取内存里的某条新闻 */
  WB.newsItem = function (catId, i) {
    var c = cache[catId];
    return c && c.items ? c.items[i] : null;
  };

  /* 局部重绘：只更新列表区与右上角时间，避免整页重渲染打断输入 */
  WB.newsPaint = function () {
    var box = document.getElementById('newsList');
    if (box) box.innerHTML = WB.newsListHTML(WB.newsState.cat);
    var ts = document.getElementById('newsTs');
    if (ts) ts.textContent = '最后更新：' + (WB.newsState.lastAt || '加载中…');
  };

  /* 进入新闻板块后自动拉取；每次打开页面都会重新请求 */
  WB.afterRender = WB.afterRender || {};
  WB.afterRender.news = function () {
    WB.newsPaint();
    WB.newsFetch(WB.newsState.cat).then(function () { WB.newsPaint(); });
  };
})();

</script>
<script>
/* ============================================================

<script>
/* ============================================================
 * section-core.js —— 今日待办 / 强身健体
 * ============================================================ */
(function () {
  WB.render = WB.render || {};

  /* 近 n 天完成率序列 */
  WB.series = function (sections, n, end) {
    var dates = WB.date.lastNDates(n, end);
    return dates.map(function (d) {
      var p = WB.progress(d, sections);
      return { date: d, label: WB.date.md(d), value: p.pct, done: p.done, total: p.total };
    });
  };

  function progressRow(name, p, color) {
    return '<div style="margin-bottom:10px">' +
      '<div class="row-between" style="margin-bottom:4px">' +
        '<span style="font-size:12.5px">' + name + '</span>' +
        '<span class="muted">' + p.done + ' / ' + p.total + '</span>' +
      '</div>' +
      '<div class="bar ' + (color || '') + '"><i style="width:' + p.pct + '%"></i></div>' +
      '</div>';
  }
  WB.progressRow = progressRow;

  /* =========================================================
   * 一、今日待办（总控）
   * ========================================================= */
  WB.render.today = function (date) {
    var isToday = date === WB.date.today();
    var p = WB.progress(date);
    var exam = WB.examInfo();
    var pl = WB.planStats(date);
    var balance = WB.coinBalance();
    var recent = WB.series(null, 14, date);

    /* 打开先把已达成的自动金币规则结算掉（每日上限 10 枚） */
    WB.settleCoins(date);

    var secRows = WB.SECTIONS.filter(function (s) {
      return ['fitness', 'english', 'guide', 'reading'].indexOf(s.id) >= 0;
    }).map(function (s) {
      var pp = WB.progress(date, [s.id]);
      return '<div style="margin-bottom:12px">' +
        '<div class="row-between" style="margin-bottom:4px">' +
          '<button class="btn sm ghost" data-act="goto" data-sec="' + s.id + '">' + s.name + ' →</button>' +
          '<span class="muted">' + pp.done + '/' + pp.total + ' · ' + pp.pct + '%</span>' +
        '</div>' +
        '<div class="bar"><i style="width:' + pp.pct + '%"></i></div>' +
        '</div>';
    }).join('');

    var html = '';
    var hr = new Date().getHours();
    var greet = hr < 6 ? '夜深了，早点休息，明天再战 🌙'
      : hr < 11 ? '早上好，一日之计在于晨，先勾一项再说 ☀️'
      : hr < 14 ? '中午好，吃完饭记得歇一歇再学习 🍚'
      : hr < 18 ? '下午好，来杯温水，继续打卡 🍵'
      : hr < 23 ? '晚上好，今天的目标都完成了吗？🌇'
      : '夜深了，收个尾就休息吧 🌙';
    if (isToday) {
      html += '<div class="banner"><div class="b-ico">🎀</div><div>' +
        '<div class="b-t">' + greet + '</div>' +
        '<div class="b-d">' + WB.esc(WB.state.settings.greeting || '嗨，老板大人') +
        '，把每一天过得有迹可循，就是了不起的自律。</div></div></div>';
    }
    html += '<div class="banner' + (isToday ? '' : ' amber') + '"><div class="b-ico">今</div><div>' +
      '<div class="b-t">' + WB.date.md(date) + ' ' + WB.date.weekday(date) + (isToday ? ' · 今天' : ' · 回溯查看') + '</div>' +
      '<div class="b-d">距导游资格考试（' + exam.date + '）还有 <b>' + exam.left + '</b> 天。' +
      '当日全部任务 ' + p.done + '/' + p.total + '，今日清单 ' + pl.done + '/' + pl.total + '。每天勾完这一页，就是给自己攒底子。</div>' +
      '</div></div>';

    html += '<div class="grid g4">' +
      WB.stat('今日清单进度', pl.pct + '<small>%</small>', pl.done + ' / ' + pl.total + ' 条精选任务', 'accent') +
      WB.stat('板块任务完成', p.pct + '<small>%</small>', p.done + ' / ' + p.total + ' 项', 'blue') +
      WB.stat('备考倒计时', exam.left + '<small>天</small>', '导游考试 ' + exam.date, 'amber') +
      WB.stat('金币余额', balance + '<small>枚</small>', '可兑换心愿奖励', '') +
      '</div>';

    /* 全勤庆祝 */
    if (pl.allDone) {
      html += '<div class="banner"><div class="b-ico">🎉</div><div>' +
        '<div class="b-t">今日清单全部完成！' + WB.date.md(date) + ' 的你超棒～</div>' +
        '<div class="b-d">别忘了去下方「🪙 金币中心」领取全勤金币。坚持不是一时热血，而是像今天这样，一天一天地攒。</div></div></div>';
    }

    /* 🧺 三大分页：今日任务 / 本周计划 / 长期目标 */
    html += WB.plannerHTML(date);

    /* 💡 灵感快捷速记 */
    html += WB.ideaHTML(date);

    /* 🎮 游戏化激励中心 */
    html += WB.gameHTML(date);

    html += '<div class="grid g2">';
    html += WB.card({
      title: '📊 各板块完成进度', sub: '点击板块名可直达',
      body: secRows
    });
    html += WB.card({
      title: '📈 近 14 天完成率', sub: '每天坚持一点点，曲线会说话',
      body: WB.bars(recent.map(function (r) { return { label: r.label, value: r.value }; }), { h: 150, labelEvery: 3, max: 100 }) +
        '<div class="hint">提示：数据按日期存储，第二天自动翻开新的一页，历史不会被清空；如需清空当日勾选，点右上角「重置当日」。</div>'
    });
    html += '</div>';

    return html;
  };

  /* =========================================================
   * 二、强身健体
   * ========================================================= */
  WB.render.fitness = function (date) {
    var monthDates = WB.date.lastNDates(30, date);
    var ser = WB.series(['fitness'], 30, date);
    var monthRate = Math.round(ser.reduce(function (a, b) { return a + b.value; }, 0) / ser.length);
    var streak = WB.streak('fitness', date);
    var bdj = WB.sumValue('fit-baduanjin', monthDates);
    var glute = monthDates.filter(function (d) {
      var l = WB.getLog(d, 'fit-glute');
      return l && (l.done || (l.value && l.value !== '休息日'));
    }).length;
    var bodyEntries = WB.entriesOf('fitness', 'body').slice(0, 12);

    var html = '';
    html += '<div class="banner"><div class="b-ico">养</div><div>' +
      '<div class="b-t">今年一定要把气血养起来，把臀练起来，调理身体</div>' +
      '<div class="b-d">' + WB.esc(WB.MOTTO.fitness) + '</div>' +
      '</div></div>';

    /* 三大跟练视频卡：每张都带粉色小标签 / 时长 / 简介 / 胶囊跳转按钮（target="_blank"） */
    var vids = WB.VIDEOS.fitness;
    html += '<div class="grid g3">' +
      WB.card({ title: '🧘‍♀️ 八段锦跟练视频', sub: '养气血 · 通经络', body: WB.videoCard(vids[0]) }) +
      WB.card({ title: '🍑 臀腿训练跟练', sub: '臀主导发力 · 别让腿代偿', body: WB.videoCard(vids[1]) }) +
      WB.card({ title: '🦶 足弓训练教程', sub: '体态矫正 · 日常必修', body: WB.videoCard(vids[2]) }) +
      '</div>';

    html += '<div class="grid g4">' +
      WB.stat('近 30 天完成率', monthRate + '<small>%</small>', '三大必做项平均', 'accent') +
      WB.stat('连续打卡', streak + '<small>天</small>', '至少完成一项即算', 'accent') +
      WB.stat('八段锦总时长', bdj + '<small>分钟</small>', '近 30 天累计', 'blue') +
      WB.stat('臀腿训练', glute + '<small>次</small>', '近 30 天', 'amber') +
      '</div>';

    html += WB.card({
      title: '🏃‍♀️ 今日必做打卡', sub: '八段锦 · 臀腿 · 足弓，每天独立记录',
      body: WB.taskList('fitness', date, { showFixed: true }) + WB.addTaskForm('fitness', date) +
        '<div class="hint">新增项目会出现在上方列表中，可随时删除；勾选与数值都会进入历史记录，可随时回溯。</div>'
    });

    /* 身体状态记录 */
    var todayBody = WB.entriesOf('fitness', 'body').filter(function (e) { return e.date === date; })[0];
    var mf = WB.BODY_FIELDS.map(function (f) {
      var v = todayBody && todayBody.meta ? (todayBody.meta[f.k] || '') : '';
      var ctl;
      if (f.type === 'select') {
        ctl = '<select data-bf="' + f.k + '"><option value="">未填</option>' +
          f.options.map(function (o) { return '<option' + (v === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select>';
      } else if (f.type === 'textarea') {
        ctl = '<textarea rows="2" data-bf="' + f.k + '" placeholder="' + WB.esc(f.ph || '') + '">' + WB.esc(v) + '</textarea>';
      } else {
        ctl = '<input type="text" data-bf="' + f.k + '" placeholder="' + WB.esc(f.ph || '') + '" value="' + WB.esc(v) + '"/>';
      }
      return '<div class="field"><label>' + f.t + '</label>' + ctl + '</div>';
    }).join('');

    html += '<div class="grid g2">';
    html += WB.card({
      title: '🩷 今日身体状态记录', sub: '腰酸 / 睡眠 / 气血 / 经期 / 体重，逐日存档',
      body: mf + '<div class="row-between"><span class="muted">保存后自动归档，可在历史记录中检索</span>' +
        '<button class="btn primary" data-act="save-body">保存' + WB.date.md(date) + '状态</button></div>'
    });

    /* 月度复盘 */
    var sleepList = WB.entriesOf('fitness', 'body').slice(0, 10).map(function (e) {
      var m = e.meta || {};
      return '<div class="kv"><span class="k">' + e.date + '</span><span>' +
        [m.sleep ? '睡眠 ' + WB.esc(m.sleep) : '', m.waist ? '腰酸 ' + WB.esc(m.waist) : '', m.energy ? '气血 ' + WB.esc(m.energy) : '', m.period ? WB.esc(m.period) : '', m.weight ? WB.esc(m.weight) + 'kg' : '']
          .filter(Boolean).join(' · ') + '</span></div>';
    }).join('');

    html += WB.card({
      title: '🌸 月度身体复盘', sub: '近 30 天完成趋势 + 身体状态流水',
      body: '<div class="k" style="font-size:11.5px;color:var(--muted);margin-bottom:6px">近 30 天每日完成率（%）</div>' +
        WB.bars(ser.map(function (r) { return { label: r.label, value: r.value }; }), { h: 130, labelEvery: 6, max: 100 }) +
        '<hr class="sep"/>' +
        '<div class="k" style="font-size:11.5px;color:var(--muted);margin-bottom:6px">最近身体状态记录</div>' +
        (sleepList || '<div class="empty">还没有记录</div>') +
        WB.addEntryForm({ section: 'fitness', type: 'body-change', titlePh: '身体变化记录，如：臀围 +1cm / 手脚不冰了', bodyPh: '详细描述（可选）', body: false })
    });
    html += '</div>';

    html += WB.card({
      title: '🌷 身体变化 & 养生记录库', sub: '长期存档，随时回看自己如何一点点变好',
      body: WB.entryList(bodyEntries.filter(function (e) { return e.type !== 'body'; }), { empty: '暂无记录，可从上方表单添加' })
    });

    return html;
  };
})();

</script>
<script>
/* ============================================================
 * section-study.js —— 英语学习 / 导游学习
 * ============================================================ */
(function () {
  var D = WB.date;

  /* =========================================================
   * 三、英语学习
   * ========================================================= */
  WB.render.english = function (date) {
    var s = WB.state;
    var streak = WB.streak('english', date);
    var allDates = Object.keys(s.logs).sort();
    var totalMin = WB.sumValue('eng-nce', allDates) + WB.sumValue('eng-duo', allDates);
    var ser = WB.series(['english'], 30, date);
    var monthMin = WB.sumValue('eng-nce', D.lastNDates(30, date)) + WB.sumValue('eng-duo', D.lastNDates(30, date));
    var lesson = +s.settings.nceLesson || 0;
    var lessonPct = Math.min(100, Math.round(lesson / 144 * 100));

    /* 每日一句：按日期确定性轮换 */
    var idx = ((D.daysFromEpoch(date) % WB.SENTENCES.length) + WB.SENTENCES.length) % WB.SENTENCES.length;
    var q = WB.SENTENCES[idx];

    var html = '';
    html += '<div class="banner blue"><div class="b-ico">语</div><div>' +
      '<div class="b-t">零基础也没关系，先把嘴练熟</div>' +
      '<div class="b-d">' + WB.esc(WB.MOTTO.english) + '　当前连续打卡 <b>' + streak + '</b> 天，累计学习 <b>' + totalMin + '</b> 分钟。</div>' +
      '</div></div>';
    /* 视频课卡片：真实链接，target="_blank" 直接跳转 B站 / 抖音 */
    html += WB.card({
      title: '🎬 视频课 · 新概念 & 音标',
      sub: '每天先这里的视频，再回上方打卡记录时长',
      body: WB.videoGrid('english', 2)
    });

    html += '<div class="grid g4">' +
      WB.stat('连续打卡', streak + '<small>天</small>', '至少完成一项即算', 'accent') +
      WB.stat('累计学习时长', totalMin + '<small>分钟</small>', '近 30 天 ' + monthMin + ' 分钟', 'blue') +
      WB.stat('新概念进度', (lesson || 0) + '<small>/144课</small>', '第一册共 144 课', 'blue') +
      WB.stat('多邻国连胜', (+s.settings.duoStreak || 0) + '<small>天</small>', 'APP 内天数，手动同步', 'amber') +
      '</div>';

    html += '<div class="grid g2">';
    html += WB.card({
      title: '🐱 今日打卡', sub: 'B站胶学新概念 + 多邻国 + 口语跟读',
      body: WB.taskList('english', date, { showFixed: true }) + WB.addTaskForm('english', date) +
        '<div class="hint">可自主添加：单词背诵、语法练习、句型训练等，支持设定每日目标值。</div>'
    });

    html += WB.card({
      title: '🎀 今日双语好句 · ' + D.md(date), sub: '每天自动更新一句，适配口语练习与应试积累',
      body: '<div class="quote">' +
        '<div class="en">“' + WB.esc(q.en) + '”</div>' +
        '<div class="zh">' + WB.esc(q.zh) + '</div>' +
        '<div class="q-meta"><span class="q-lab">第 ' + (idx + 1) + ' / ' + WB.SENTENCES.length + ' 句</span>' +
          '<button class="btn sm primary" data-act="save-sentence" data-idx="' + idx + '">收藏进句库</button>' +
          '<button class="btn sm" data-act="read-done">标记已跟读</button>' +
        '</div></div>' +
        '<hr class="sep"/>' +
        '<div class="k" style="font-size:11.5px;color:var(--muted);margin-bottom:8px">我的句库（' + WB.entriesOf('english', 'sentence').length + ' 句）</div>' +
        '<div class="scroll-y">' + WB.entryList(WB.entriesOf('english', 'sentence').slice(0, 30), { empty: '还没有收藏的句子' }) + '</div>'
    });
    html += '</div>';

    /* 进度设置 */
    html += WB.card({
      title: '⚙️ 进度设置', sub: '新概念课号 / 多邻国连胜天数，改动即时保存',
      body: '<div class="add-row" style="border-top:none;padding-top:0;margin-top:0">' +
        '<label class="muted">新概念当前课号</label>' +
        '<input type="number" min="0" max="144" value="' + lesson + '" data-act="setting" data-key="nceLesson"/>' +
        '<label class="muted">多邻国连胜天数</label>' +
        '<input type="number" min="0" value="' + (+s.settings.duoStreak || 0) + '" data-act="setting" data-key="duoStreak"/>' +
        '</div>' +
        '<div class="progress-line" style="margin-top:6px"><div class="bar blue"><i style="width:' + lessonPct + '%"></i></div><span class="pct">' + lessonPct + '%</span></div>'
    });

    /* 对标激励 */
    var cur = 0;
    WB.ENG_MILESTONES.forEach(function (m, i) { if (streak >= m.d) cur = i; });
    var ms = WB.ENG_MILESTONES.map(function (m, i) {
      return '<div class="milestone"><div class="ms-dot' + (i <= cur ? ' on' : '') + '"></div>' +
        '<div class="ms-body"><div class="ms-t">' + m.t + (i === cur ? '　<span class="tag-pill">当前阶段</span>' : '') + '</div>' +
        '<div class="ms-d">' + m.s + '</div></div></div>';
    }).join('');
    var cases = WB.ENG_CASES.map(function (c) {
      return '<div class="case"><div class="c-name">' + WB.esc(c.name) + '</div><div class="c-meta">' + WB.esc(c.meta) + '</div>' +
        '<div class="c-txt">' + WB.esc(c.txt) + '</div></div>';
    }).join('');

    html += '<div class="grid g2">' +
      WB.card({ title: '🛤️ 对标进度 · 普通人零基础进阶路线', sub: '你已连续 ' + streak + ' 天，当前处于第 ' + (cur + 1) + ' 阶段', body: ms }) +
      WB.card({ title: '🌟 同款打卡案例 · 别人可以，你也可以', sub: '真实节奏参考，别和别人比速度，和自己比天数', body: '<div class="entries">' + cases + '</div>' }) +
      '</div>';

    html += WB.card({
      title: '📈 近 30 天学习完成率', sub: '每天勾一项，曲线自然抬起来',
      body: WB.bars(ser.map(function (r) { return { label: r.label, value: r.value }; }), { h: 140, labelEvery: 6, max: 100 })
    });

    return html;
  };

  /* =========================================================
   * 四、导游学习（11.21 冲刺）
   * ========================================================= */
  WB.render.guide = function (date) {
    var s = WB.state;
    var exam = WB.examInfo();
    var allDates = Object.keys(s.logs).sort();
    var totalQ = WB.sumValue('gd-quiz', allDates);

    /* 错题统计：历史「错题数」记录优先，没有则用当天「错题本」条目数（自动取数） */
    var missByDate = {};
    WB.entriesOf('guide', 'mistake').forEach(function (e) { missByDate[e.date] = (missByDate[e.date] || 0) + 1; });
    Object.keys(missByDate).forEach(function (d) { if (allDates.indexOf(d) < 0) allDates.push(d); });
    allDates.sort();
    function wrongOf(d) {
      var v = parseFloat((WB.getLog(d, 'gd-wrong') || {}).value);
      if (!isNaN(v)) return v;
      return missByDate[d] || 0;
    }
    var totalW = allDates.reduce(function (a, d) { return a + wrongOf(d); }, 0);
    var rate = totalQ ? Math.round((totalQ - totalW) / totalQ * 1000) / 10 : 0;
    var streak = WB.streak('guide', date);
    var target = +s.settings.guideDailyTarget || 200;
    var last30 = D.lastNDates(30, date);
    var quiz30 = WB.sumValue('gd-quiz', last30);

    var ratePts = last30.map(function (d) {
      var l = WB.getLog(d, 'gd-quiz');
      var qv = l && l.value !== '' ? parseFloat(l.value) : null;
      var wv = wrongOf(d);
      return { label: D.md(d), value: qv ? Math.round((qv - wv) / qv * 1000) / 10 : null };
    });
    var quizPts = last30.map(function (d) {
      var l = WB.getLog(d, 'gd-quiz');
      return { label: D.md(d), value: l && l.value !== '' ? parseFloat(l.value) : 0, color: (parseFloat(l && l.value) >= target) ? '#ef7fa2' : '#f6d3de' };
    });

    var idx = ((D.daysFromEpoch(date) % WB.GUIDE_POINTS.length) + WB.GUIDE_POINTS.length) % WB.GUIDE_POINTS.length;
    var gp = WB.GUIDE_POINTS[idx];

    var html = '';
    html += '<div class="banner amber"><div class="b-ico">冲</div><div>' +
      '<div class="b-t">距 ' + exam.date + ' 导游资格考试还有 ' + exam.left + ' 天</div>' +
      '<div class="b-d">' + WB.esc(WB.MOTTO.guide) + '　按每天 ' + target + ' 题计，剩余时间还能刷 <b>' + (exam.left * target) + '</b> 题。</div>' +
      '</div></div>';
    html += WB.jumpBar('guide');

    html += '<div class="grid g4">' +
      WB.stat('考试倒计时', exam.left + '<small>天</small>', exam.date, 'amber') +
      WB.stat('累计刷题', totalQ + '<small>题</small>', '近 30 天 ' + quiz30 + ' 题', 'accent') +
      WB.stat('平均正确率', rate + '<small>%</small>', '错题累计 ' + totalW + ' 道', 'blue') +
      WB.stat('连续备考', streak + '<small>天</small>', '目标 ' + target + ' 题/天', 'accent') +
      '</div>';

    html += '<div class="grid g2">';
    html += WB.card({
      title: '🧭 今日冲刺打卡', sub: '每日 200+ 题，错题记进下方「错题本」，正确率自动统计',
      body: WB.taskList('guide', date, { showFixed: true }) + WB.addTaskForm('guide', date) +
        '<div class="hint">可自主添加：背诵计划、模拟测试、知识点复盘等任务。</div>'
    });

    html += WB.card({
      title: '📮 今日考点推送 · ' + D.md(date), sub: '文学常识 / 历史文化 / 旅游法规 / 地理民俗，每日轮换',
      body: '<div class="knowledge">' +
        '<div class="k-lab">' + WB.esc(gp.cat) + '</div>' +
        '<div class="k-q">' + WB.esc(gp.q) + '</div>' +
        '<div class="k-a">' + WB.esc(gp.a) + '</div>' +
        '</div>' +
        '<div class="row-between" style="margin-top:12px">' +
          '<span class="muted">考点内容以当年官方教材为准，此处为高频要点速记</span>' +
          '<span><button class="btn sm" data-act="random-point">换一条</button> ' +
          '<button class="btn sm primary" data-act="save-point" data-idx="' + idx + '">存入重点</button></span>' +
        '</div>'
    });
    html += '</div>';

    /* 考点检索 */
    html += WB.card({
      title: '🔍 考点库检索', sub: '共 ' + WB.GUIDE_POINTS.length + ' 条高频考点，输入关键词即时筛选',
      body: '<div class="search-bar"><input type="text" id="pointSearch" data-act="search-points" placeholder="如：唐宋八大家 / 质量保证金 / 五岳"/></div>' +
        '<div id="pointList" style="margin-top:10px" class="scroll-y">' + pointListHTML('') + '</div>'
    });

    /* 错题 / 重点 / 计划 */
    html += '<div class="grid g2">';
    html += WB.card({
      title: '📕 错题本', sub: '记录错题与错因，自动存档，考前集中过一遍',
      body: WB.addEntryForm({ section: 'guide', type: 'mistake', titlePh: '题目 / 知识点', bodyPh: '错因分析、正确解法…', tagField: true, tagPh: '分类 如 法规' }) +
        '<div class="scroll-y" style="margin-top:10px">' + WB.entryList(WB.entriesOf('guide', 'mistake'), { empty: '还没有错题记录', pill: 'red' }) + '</div>'
    });
    html += WB.card({
      title: '✨ 重点知识 & 背诵要点', sub: '自己整理的才是记得住的',
      body: WB.addEntryForm({ section: 'guide', type: 'point', titlePh: '重点标题', bodyPh: '要点内容 / 口诀…', tagField: true, tagPh: '科目' }) +
        '<div class="scroll-y" style="margin-top:10px">' + WB.entryList(WB.entriesOf('guide', 'point'), { empty: '还没有重点记录', pill: 'blue' }) + '</div>'
    });
    html += '</div>';

    /* 统计 */
    html += '<div class="grid g2">' +
      WB.card({ title: '📈 正确率提升曲线', sub: '近 30 天（%）', body: WB.line(ratePts, { h: 170, min: 0, max: 100, labelEvery: 6, decimal: 0 }) }) +
      WB.card({ title: '📊 每日刷题量', sub: '近 30 天，深色代表达成 ' + target + ' 题目标', body: WB.bars(quizPts, { h: 170, labelEvery: 6 }) }) +
      '</div>';

    return html;
  };

  WB.pointListHTML = function (kw) {
    var list = WB.GUIDE_POINTS.filter(function (p) {
      if (!kw) return true;
      return (p.q + p.a + p.cat).toLowerCase().indexOf(kw.toLowerCase()) >= 0;
    });
    if (!list.length) return '<div class="empty">没有匹配的考点</div>';
    return list.map(function (p) {
      return '<div class="knowledge" style="margin-bottom:10px">' +
        '<div class="k-lab">' + WB.esc(p.cat) + '</div>' +
        '<div class="k-q">' + WB.esc(p.q) + '</div>' +
        '<div class="k-a">' + WB.esc(p.a) + '</div></div>';
    }).join('');
  };
  function pointListHTML(kw) { return WB.pointListHTML(kw); }
})();

</script>
<script>
/* ============================================================
 * section-archive.js —— 增进知识 / 每日阅读 / 重要新闻 / 每日复盘 / 历史记录
 * ============================================================ */
(function () {
  var D = WB.date;

  /* =========================================================
   * 五、增进知识
   * ========================================================= */
  WB.render.knowledge = function (date) {
    var all = WB.entriesOf('knowledge');
    var kw = WB.kwQuery || '';
    var list = kw ? all.filter(function (e) {
      return ((e.title || '') + (e.body || '') + (e.tag || '')).toLowerCase().indexOf(kw.toLowerCase()) >= 0;
    }) : all;
    var month = date.slice(0, 7);
    var monthNew = all.filter(function (e) { return (e.date || '').slice(0, 7) === month; }).length;
    var tags = {};
    all.forEach(function (e) { (e.tag || '未分类').split(/[,，]/).forEach(function (t) { t = t.trim(); if (t) tags[t] = (tags[t] || 0) + 1; }); });
    var tagHtml = Object.keys(tags).sort(function (a, b) { return tags[b] - tags[a]; }).slice(0, 20).map(function (t) {
      return '<span class="tag-pill" style="margin:0 6px 6px 0;display:inline-block;cursor:pointer" data-act="kw-tag" data-tag="' + WB.esc(t) + '">' + WB.esc(t) + ' · ' + tags[t] + '</span>';
    }).join('') || '<span class="muted">还没有标签</span>';

    var html = '';
    html += '<div class="banner"><div class="b-ico">知</div><div>' +
      '<div class="b-t">随手存，随时查 —— 你自己的第二大脑</div>' +
      '<div class="b-d">干货、行业知识、冷门常识、专业拓展，任何想留下的东西都往这里扔，永久存档，关键词一秒找到。</div>' +
      '</div></div>';

    html += '<div class="grid g4">' +
      WB.stat('知识条目', all.length + '<small>条</small>', '永久存档', 'accent') +
      WB.stat('本月新增', monthNew + '<small>条</small>', month, 'blue') +
      WB.stat('当前检索', list.length + '<small>条</small>', kw ? '关键词：' + kw : '全部', 'amber') +
      WB.stat('标签数', Object.keys(tags).length + '<small>个</small>', '点击标签可快速检索', '') +
      '</div>';

    /* 灵感随笔专区：自动同步「今日待办 → 💡 灵感快捷速记」写入的内容 */
    var ideas = WB.entriesOf('today', 'idea');
    html += WB.card({
      title: '💫 灵感随笔专区', sub: '在「今日待办」随时速记的内容会自动同步到这里',
      right: '<span class="tag-pill">' + ideas.length + ' 条</span>',
      body: ideas.length
        ? '<div class="scroll-y" style="max-height:320px">' + WB.entryList(ideas, { empty: '还没有灵感' }) + '</div>'
        : '<div class="empty">还没有灵感记录。去「今日待办 → 💡 灵感快捷速记」写一句试试～</div>'
    });

    html += WB.card({
      title: '💡 存入新知识', sub: '标题 + 标签 + 内容，回车即存（永久保存，不丢失）',
      body: WB.addEntryForm({ section: 'knowledge', titlePh: '标题 / 关键词', bodyPh: '内容详情…', tagField: true, tagPh: '标签(逗号分隔)' })
    });

    html += WB.card({
      title: '🗃️ 知识库', sub: '共 ' + all.length + ' 条，支持关键词快速检索',
      right: '<div class="search-bar"><input type="text" id="kwSearch" data-act="search-kw" placeholder="输入关键词检索…" value="' + WB.esc(kw) + '"/>' +
        (kw ? '<button class="btn sm" data-act="clear-kw">清除</button>' : '') + '</div>',
      body: '<div style="margin-bottom:12px">' + tagHtml + '</div>' +
        '<div class="scroll-y" style="max-height:560px">' + WB.entryList(list, { empty: '还没有内容，从上方表单存入第一条吧' }) + '</div>'
    });

    return html;
  };

  /* =========================================================
   * 六、每日阅读
   * ========================================================= */
  WB.render.reading = function (date) {
    var all = WB.entriesOf('reading');
    var taskMin = WB.sumValue('read-daily', Object.keys(WB.state.logs).sort());
    var entryMin = all.reduce(function (a, e) { return a + (parseFloat(e.meta && e.meta.minutes) || 0); }, 0);
    var books = {};
    all.forEach(function (e) { if (e.tag) books[e.tag] = 1; });
    var streak = WB.streak('reading', date);
    var ser = WB.series(['reading'], 30, date);

    var html = '';
    html += '<div class="banner blue"><div class="b-ico">读</div><div>' +
      '<div class="b-t">每天读一点，一年就是几十本</div>' +
      '<div class="b-d">记录书名、时长、摘抄与感悟，自动积累成你的私人阅读库。</div>' +
      '</div></div>';
    html += WB.jumpBar('reading');

    html += '<div class="grid g4">' +
      WB.stat('累计阅读时长', (taskMin + entryMin) + '<small>分钟</small>', '约 ' + ((taskMin + entryMin) / 60).toFixed(1) + ' 小时', 'accent') +
      WB.stat('阅读记录', all.length + '<small>条</small>', '读过的书/篇 ' + Object.keys(books).length + ' 种', 'blue') +
      WB.stat('连续阅读', streak + '<small>天</small>', '保持住', 'accent') +
      WB.stat('近 30 天完成率', Math.round(ser.reduce(function (a, b) { return a + b.value; }, 0) / ser.length) + '<small>%</small>', '阅读打卡', 'amber') +
      '</div>';

    html += '<div class="grid g2">';
    html += WB.card({
      title: '📚 今日阅读打卡', sub: '时长、书名、章节随手记',
      body: WB.taskList('reading', date, { showFixed: true }) + WB.addTaskForm('reading', date)
    });
    html += WB.card({
      title: '✍️ 记录一条阅读', sub: '书名 / 作者 / 时长 / 摘抄感悟',
      body: '<div class="add-row" data-scope="addentry" data-section="reading" data-type="read" style="border-top:none;padding-top:0;margin-top:0">' +
        '<input type="text" data-f="title" placeholder="书名 / 章节" style="flex:1;min-width:140px"/>' +
        '<input type="text" data-f="tag" placeholder="作者 / 分类" style="max-width:130px"/>' +
        '<input type="number" data-f="minutes" placeholder="分钟" style="max-width:80px"/>' +
        '<textarea data-f="body" rows="2" placeholder="摘抄 / 感悟…" style="flex:2;min-width:180px"></textarea>' +
        '<button class="btn primary" data-act="add-entry">存入阅读库</button></div>' +
        '<div class="hint">摘抄与感悟会永久保留，可在「历史记录」按关键词搜索到。</div>'
    });
    html += '</div>';

    html += WB.card({
      title: '📖 阅读库', sub: '共 ' + all.length + ' 条记录，按时间倒序',
      body: '<div class="scroll-y" style="max-height:520px">' + WB.entryList(all, {
        empty: '还没有阅读记录',
        pill: 'blue'
      }) + '</div>'
    });

    return html;
  };

  /* =========================================================
   * 七、重要新闻
   * ========================================================= */
  WB.render.news = function (date) {
    var all = WB.entriesOf('news');
    var channels = (WB.state.settings.newsChannels && WB.state.settings.newsChannels.length)
      ? WB.state.settings.newsChannels
      : WB.NEWS_CHANNELS.slice();
    var byDate = {};
    all.forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });
    var dates = Object.keys(byDate).sort().reverse();
    var cat = WB.newsState.cat;

    var html = '';
    html += '<div class="banner amber"><div class="b-ico">闻</div><div>' +
      '<div class="b-t">时政热点 · 经济动态 · 行业资讯，实时拉取</div>' +
      '<div class="b-d">打开本板块自动请求最新 RSS（每次刷新重新拉取，不做缓存）；源站不可用时会自动降级到真实热点站点。</div>' +
      '</div></div>';

    /* 实时新闻区：三枚粉色胶囊分类标签 + 右上角最后更新时间 */
    html += WB.card({
      title: '📡 今日实时新闻',
      sub: '每个分类展示最新 10 条 · 点击标题 target="_blank" 跳转原文',
      right: '<div class="news-meta"><span class="muted" id="newsTs">最后更新：加载中…</span>' +
        '<button class="btn sm" data-act="news-refresh">刷新</button></div>',
      body: WB.newsTabsHTML() +
        '<div id="newsList">' + WB.newsListHTML(cat) + '</div>' +
        '<div class="hint">源优先级：时政＝人民网 → 中国政府网 → 中新网；经济＝财联社 → 中新网财经 → 新浪财经；行业＝36氪 → 极客公园 → cnBeta。' +
        '若某源停更超过 7 天会自动切到下一个新鲜源；全部不可用时显示「点击查看今日热点」的真实站点入口。' +
        '想改源或改降级入口：编辑 assets/js/data.js 的 WB.NEWS_FEEDS。看到重要内容点右侧「存档」，就会永久留在下方存档里。</div>'
    });

    html += '<div class="grid g3">' +
      WB.stat('新闻存档', all.length + '<small>条</small>', '覆盖 ' + dates.length + ' 天', 'amber') +
      WB.stat('今日记录', (byDate[date] || []).length + '<small>条</small>', D.md(date), 'accent') +
      WB.stat('关注方向', channels.length + '<small>个</small>', '可自行增删', 'blue') +
      '</div>';

    html += WB.card({
      title: '🗞️ 手动添加一条新闻 / 资讯', sub: '标题 + 来源 + 分类 + 要点，永久存档',
      body: '<div class="add-row" data-scope="addentry" data-section="news" data-type="news" style="border-top:none;padding-top:0;margin-top:0">' +
        '<input type="text" data-f="title" placeholder="新闻标题" style="flex:1.4;min-width:160px"/>' +
        '<input type="text" data-f="tag" placeholder="分类，如 时政/文旅/考试" style="max-width:150px"/>' +
        '<input type="text" data-f="source" placeholder="来源，如 新华社" style="max-width:130px"/>' +
        '<textarea data-f="body" rows="2" placeholder="要点摘要 / 与考试的关联…" style="flex:2;min-width:180px"></textarea>' +
        '<button class="btn primary" data-act="add-entry">存档</button></div>'
    });

    html += '<div class="grid g2">';
    html += WB.card({
      title: '👀 关注清单', sub: '提醒自己每天扫一眼的方向',
      body: channels.map(function (c, i) {
        return '<div class="kv"><span>' + WB.esc(c) + '</span>' +
          '<button class="ico-btn" data-act="del-channel" data-i="' + i + '">✕</button></div>';
      }).join('') +
        '<div class="add-row"><input type="text" id="chInput" placeholder="新增关注方向…"/>' +
        '<button class="btn" data-act="add-channel">+ 添加</button></div>'
    });
    html += WB.card({
      title: '🗂️ 近期新闻存档', sub: '最新的 6 天',
      body: '<div class="scroll-y" style="max-height:420px">' +
        (dates.length ? dates.slice(0, 6).map(function (d) {
          return '<div class="day-group" style="margin-bottom:10px"><div class="day-h"><span>' + d + ' ' + D.weekday(d) + '</span><span class="cnt">' + byDate[d].length + ' 条</span></div>' +
            byDate[d].map(function (e) {
              return '<div class="hist-item"><span class="h-sec">' + WB.esc(e.tag || '资讯') + '</span>' +
                '<div class="h-main"><div class="h-t">' + WB.esc(e.title) + '</div>' +
                (e.body ? '<div class="h-d">' + WB.esc(e.body) + '</div>' : '') +
                (e.meta && e.meta.source ? '<div class="h-d">来源：' + WB.esc(e.meta.source) + '</div>' : '') +
                '</div><button class="ico-btn" data-act="del-entry" data-id="' + e.id + '">✕</button></div>';
            }).join('') + '</div>';
        }).join('') : '<div class="empty">还没有新闻存档</div>') +
        '</div>'
    });
    html += '</div>';

    return html;
  };

  /* =========================================================
   * 八、每日复盘
   * ========================================================= */
  WB.render.review = function (date) {
    var scope = 'review|' + date;
    var fields = WB.REVIEW_FIELDS.map(function (f) {
      var v = WB.getDraft(scope, f.k);
      var isProg = f.k === 'progress';
      return '<div class="field">' +
        '<label>' + f.t + '<span>' + f.hint + '</span>' +
          '<span class="saved-flag" data-flag="' + f.k + '">已保存</span>' +
          (isProg ? '<button class="btn xs" data-act="auto-progress">📊 带入当日数据</button>' : '') +
        '</label>' +
        '<textarea data-as="' + f.k + '" data-scope="' + scope + '" data-field="' + f.k + '" rows="3" placeholder="' + WB.esc(f.hint) + '">' + WB.esc(v) + '</textarea>' +
        '</div>';
    }).join('');

    var reviews = WB.entriesOf('review');
    var p = WB.progress(date);

    /* ---------- 自动统计（数据全部来自本机打卡记录） ---------- */
    var last7 = D.lastNDates(7, date);
    var rate7 = last7.map(function (d) { return WB.progress(d).pct; });
    var fit7 = last7.map(function (d) { return WB.sectionActive('fitness', d) ? 1 : 0; });
    var heat30 = D.lastNDates(30, date).map(function (d) { return { date: d, n: WB.dayDoneCount(d) }; });
    var weekStats = WB.weekSectionStats(date);
    var seq = WB.streakAny(date);
    var monthDays = WB.monthActiveDays(date);
    var weekDates = WB.weekDates(date);
    var weekActiveDays = weekDates.filter(function (d) { return WB.dayActive(d); }).length;
    var avg7 = Math.round(rate7.reduce(function (a, b) { return a + b; }, 0) / 7);

    /* 习惯打卡热力图：近 30 天，打卡日显示粉色爱心 */
    var heatHtml = heat30.map(function (h) {
      var lv = h.n === 0 ? 0 : (h.n <= 2 ? 1 : (h.n <= 4 ? 2 : 3));
      var day = D.parse(h.date).getDate();
      return '<div class="heat-cell l' + lv + '" title="' + h.date + ' · 完成 ' + h.n + ' 项">' +
        (h.n ? '<span class="hi">💗</span>' : '<span class="hi dim">·</span>') +
        '<small>' + day + '</small></div>';
    }).join('');

    var weekKey = weekDates[0];   // 本周周一，作为周评存储键
    var selfVal = WB.getDraft('weekly|' + weekKey, 'self');

    var html = '';
    html += '<div class="banner"><div class="b-ico">省</div><div>' +
      '<div class="b-t">' + D.md(date) + ' 复盘 · 当日完成 ' + p.done + '/' + p.total + '（' + p.pct + '%）</div>' +
      '<div class="b-d">下面所有图表都根据你的真实打卡数据自动生成，不用手动录入一分一毫；每次打开都会重新统计。</div>' +
      '</div></div>';

    /* 大数字：连续打卡 */
    html += '<div class="big-strip">' +
      '<div class="big-num"><div class="bn-v">' + seq + '</div><div class="bn-k">连续打卡天数</div></div>' +
      '<div class="big-side">' +
        '<div class="bs-item"><b>' + monthDays + '</b><span>本月打卡天数</span></div>' +
        '<div class="bs-item"><b>' + weekActiveDays + '<small>/7</small></b><span>本周有记录天数</span></div>' +
        '<div class="bs-item"><b>' + avg7 + '<small>%</small></b><span>近 7 天平均完成率</span></div>' +
        '<div class="bs-item"><b>' + reviews.length + '</b><span>累计复盘篇数</span></div>' +
      '</div>' +
      '</div>';

    html += '<div class="grid g2">';
    html += WB.card({
      title: '📈 近 7 天待办完成率', sub: '折线图 · 每天所有板块任务的完成百分比',
      body: '<div class="chart-box"><canvas id="chartRate7"></canvas></div>'
    });
    html += WB.card({
      title: '🏃‍♀️ 近 7 天运动打卡天数', sub: '柱状图 · 当天完成任意一项运动即计 1 天',
      body: '<div class="chart-box"><canvas id="chartFit7"></canvas></div>'
    });
    html += '</div>';

    html += WB.card({
      title: '💗 习惯打卡热力图 · 近 30 天', sub: '爱心 = 当天有打卡完成，颜色越深完成项越多（鼠标/长按可看详情）',
      body: '<div class="heat">' + heatHtml + '</div>' +
        '<div class="heat-legend">' +
          '<span><i class="lg l0"></i>没打卡</span>' +
          '<span><i class="lg l1"></i>1-2 项</span>' +
          '<span><i class="lg l2"></i>3-4 项</span>' +
          '<span><i class="lg l3"></i>5 项+</span>' +
        '</div>'
    });

    html += WB.card({
      title: '📊 本周各模块学习记录统计', sub: '横向柱状 · 每个模块本周打卡了几次',
      body: '<div class="chart-box tall"><canvas id="chartWeekSec"></canvas></div>' +
        '<div class="row-between" style="margin-top:10px">' +
          weekStats.map(function (w) {
            return '<span class="tag-pill">' + w.name + ' ' + w.count + ' 次</span>';
          }).join('') +
        '</div>'
    });

    html += '<div class="grid g2">';
    html += WB.card({
      title: '🌙 今日复盘 · 三大固定维度', sub: '① 完成进度　② 问题卡点　③ 明日优化，输入自动保存',
      right: '<button class="btn primary sm" data-act="archive-review">归档今日复盘</button>',
      body: fields +
        '<div class="hint">「📊 带入当日数据」会把今天的打卡统计自动写进第一栏（可再自行补充文字）；三栏都写完点右上角归档，就永久存在历史记录里了。</div>'
    });
    html += WB.card({
      title: '💡 复盘小提示', sub: '写得越具体，明天越有方向',
      body: '<div class="kv"><span class="k">① 不写流水账</span><span></span></div>' +
        '<div class="entry-b">只写"今天做了什么"没用，要写"哪一步卡住了、明天怎么绕过去"。</div>' +
        '<div class="kv"><span class="k">② 未完成要归因</span><span></span></div>' +
        '<div class="entry-b">是安排太多、时间被切碎、还是身体状态差？归因对了才好调整。</div>' +
        '<div class="kv"><span class="k">③ 优化计划要可执行</span><span></span></div>' +
        '<div class="entry-b">"明天要更努力"不是计划，"明早 7 点先做 200 题"才是。</div>' +
        '<div class="kv"><span class="k">④ 每周回看一次</span><span></span></div>' +
        '<div class="entry-b">在「历史记录」搜索复盘，看看一周里反复出现的问题是什么。</div>'
    });
    html += '</div>';

    html += WB.card({
      title: '🖊️ 本周自评 & 总结', sub: '本周（' + weekKey + ' 起）输入即自动保存，下周自动换新页',
      right: '<span class="saved-flag" data-flag="weekly">已保存</span>' +
        '<button class="btn sm primary" data-act="archive-weekly">归档本周自评</button>',
      body: '<textarea data-as="self" data-scope="weekly|' + weekKey + '" rows="5" ' +
        'placeholder="这周整体怎么样？三件有成就感的事 + 一件做不到的 + 下周要改的一个动作…">' + WB.esc(selfVal) + '</textarea>'
    });

    html += WB.card({
      title: '📚 历史复盘', sub: '共 ' + reviews.length + ' 篇，永久保存',
      body: '<div class="scroll-y" style="max-height:520px">' + WB.entryList(reviews, { empty: '还没有归档的复盘' }) + '</div>'
    });

    return html;
  };

  WB.afterRender = WB.afterRender || {};
  WB.afterRender.review = function (date) {
    if (WB.buildReviewCharts) WB.buildReviewCharts(date);
  };

  /* 生成「今日完成进度」的统计文案（数据全部来自本机打卡记录） */
  WB.autoProgressText = function (date) {
    var p = WB.progress(date);
    var secs = ['fitness', 'english', 'guide', 'reading'];
    var parts = secs.map(function (sid) {
      var pp = WB.progress(date, [sid]);
      return (WB.SEC_NAME[sid] || sid) + ' ' + pp.done + '/' + pp.total;
    });
    var pl = WB.planStats ? WB.planStats(date) : null;
    var txt = '当日任务完成 ' + p.done + '/' + p.total + '（' + p.pct + '%）。各板块：' + parts.join('、') + '。';
    if (pl) txt += '今日清单随机计划 ' + pl.done + '/' + pl.total + '（' + pl.pct + '%）。';
    var coins = WB.coinEarnedOn ? WB.coinEarnedOn(date) : 0;
    if (coins) txt += '今日获得金币 ' + coins + ' 枚。';
    return txt;
  };

  /* =========================================================
   * 九、历史记录（全局存档检索中心）
   * ========================================================= */
  WB.render.history = function (date) {
    var items = WB.buildHistory();
    var q = (WB.histQuery || '').trim().toLowerCase();
    var sec = WB.histSection || '';
    var from = WB.histFrom || '', to = WB.histTo || '';

    var filtered = items.filter(function (it) {
      if (sec && it.secId !== sec) return false;
      if (from && it.date < from) return false;
      if (to && it.date > to) return false;
      if (q && ((it.title + it.detail + it.secName + it.date).toLowerCase().indexOf(q) < 0)) return false;
      return true;
    });

    var dates = {};
    filtered.forEach(function (it) { (dates[it.date] = dates[it.date] || []).push(it); });
    var keys = Object.keys(dates).sort().reverse().slice(0, 120);

    var body = keys.length ? keys.map(function (d) {
      return '<div class="day-group" style="margin-bottom:12px">' +
        '<div class="day-h"><span>' + d + ' ' + D.weekday(d) + '</span><span class="cnt">' + dates[d].length + ' 条</span></div>' +
        dates[d].map(function (it) {
          return '<div class="hist-item">' +
            '<span class="h-sec">' + WB.esc(it.secName) + '</span>' +
            '<div class="h-main"><div class="h-t">' + WB.esc(it.title) +
              (it.value ? '　<span class="tag-pill">' + WB.esc(it.value) + '</span>' : '') + '</div>' +
            (it.detail ? '<div class="h-d">' + WB.esc(it.detail) + '</div>' : '') +
            '</div></div>';
        }).join('') + '</div>';
    }).join('') : '<div class="empty">没有匹配的记录</div>';

    var totalDays = Object.keys(WB.state.logs).length;
    var secCounts = {};
    items.forEach(function (it) { secCounts[it.secId] = (secCounts[it.secId] || 0) + 1; });

    var html = '';
    html += '<div class="banner"><div class="b-ico">档</div><div>' +
      '<div class="b-t">全局存档检索中心 —— 随时往里扔东西，回头一秒找到</div>' +
      '<div class="b-d">全部打卡、文字记录、学习内容、训练记录、复盘内容自动归档，支持按日期、板块、关键词检索，永久保存、无限叠加。</div>' +
      '</div></div>';

    html += '<div class="grid g4">' +
      WB.stat('归档记录', items.length + '<small>条</small>', '打卡 + 文字记录', 'accent') +
      WB.stat('有记录天数', totalDays + '<small>天</small>', '从使用第一天开始累加', 'blue') +
      WB.stat('当前结果', filtered.length + '<small>条</small>', q || sec ? '已筛选' : '全部', 'amber') +
      WB.stat('数据体积', Math.round((WB.LS.getItem('wb-discipline-v1') || '').length / 1024) + '<small>KB</small>', '建议定期导出备份', '') +
      '</div>';

    html += WB.card({
      title: '🔍 检索', sub: '关键词 / 板块 / 日期范围',
      body: '<div class="search-bar">' +
        '<input type="text" id="histSearch" data-act="search-hist" placeholder="搜索关键词，如：八段锦 / 唐宋八大家 / 复盘…" value="' + WB.esc(WB.histQuery || '') + '"/>' +
        '<select data-act="filter-sec">' +
          '<option value="">全部板块</option>' +
          WB.SECTIONS.filter(function (s) { return s.id !== 'history'; }).map(function (s) {
            return '<option value="' + s.id + '"' + (sec === s.id ? ' selected' : '') + '>' + s.name + '（' + (secCounts[s.id] || 0) + '）</option>';
          }).join('') +
        '</select>' +
        '<input type="date" data-act="filter-from" value="' + from + '"/>' +
        '<span class="muted">至</span>' +
        '<input type="date" data-act="filter-to" value="' + to + '"/>' +
        '<button class="btn" data-act="clear-hist">清除筛选</button>' +
        '<button class="btn ghost" data-act="export">导出备份</button>' +
        '</div>'
    });

    html += WB.card({
      title: '🗓️ 归档时间线', sub: '按日期倒序，最多显示 120 天',
      body: body
    });

    return html;
  };

  /* 构建全局历史条目 */
  WB.buildHistory = function () {
    var out = [];
    var byId = {};
    WB.state.tasks.forEach(function (t) { byId[t.id] = t; });
    Object.keys(WB.state.logs).forEach(function (d) {
      var day = WB.state.logs[d];
      Object.keys(day).forEach(function (tid) {
        var l = day[tid], t = byId[tid];
        if (!t) return;
        var has = l.done || (l.value !== '' && l.value != null) || l.note;
        if (!has) return;
        out.push({
          date: d, secId: t.section, secName: WB.SEC_NAME[t.section] || t.section,
          title: t.title,
          value: l.value ? l.value + (t.unit || '') : (l.done ? '已完成' : ''),
          detail: l.note || ''
        });
      });
    });
    WB.state.entries.forEach(function (e) {
      out.push({
        date: e.date, secId: e.section, secName: WB.SEC_NAME[e.section] || e.section,
        title: e.title || (e.type === 'review' ? '每日复盘' : '记录'),
        value: e.meta && e.meta.minutes ? e.meta.minutes + '分钟' : '',
        detail: e.body || ''
      });
    });
    out.sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
    return out;
  };
})();

</script>
<script>
/* ============================================================
 * game.js —— 今日清单三分页 / 灵感速记 / 游戏化激励中心
 *
 * 今日清单：今日任务（按日期随机 6 条，全完成领金币）
 * 本周计划：轻量化短期统筹，按自然周归档
 * 长期目标：可拖动进度条，自动统计总进度与完成率
 * 激励中心：金币规则（每日上限 10）＋ 心愿兑换 ＋ 收支流水 ＋ 打卡体系
 * ============================================================ */
(function () {
  var D = WB.date;
  var CHECK = '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2 4.6 8.8 10 3.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  WB.planTab = WB.planTab || 'today';   // today | week | goal

  /* =========================================================
   * 🧺 三大分页
   * ========================================================= */
  var TABS = [
    { id: 'today', name: '今日任务', ico: '🧺' },
    { id: 'week',  name: '本周计划', ico: '🗓️' },
    { id: 'goal',  name: '长期目标', ico: '🎯' }
  ];

  WB.plannerHTML = function (date) {
    var tabs = TABS.map(function (t) {
      return '<button class="ptab' + (WB.planTab === t.id ? ' on' : '') + '" data-act="plan-tab" data-tab="' + t.id + '">' +
        '<span>' + t.ico + '</span>' + t.name + '</button>';
    }).join('');

    var body = WB.planTab === 'week' ? weekHTML(date)
      : WB.planTab === 'goal' ? goalHTML(date)
      : todayHTML(date);

    return '<section class="card plan-card">' +
      '<div class="plan-tabs">' + tabs + '</div>' +
      '<div class="plan-body">' + body + '</div>' +
      '</section>';
  };

  /* 底部奖励条：全勤可领 / 已到账 / 还差几条（局部刷新时也会复用） */
  WB.planGiftHTML = function (date) {
    var st = WB.planStats(date);
    var rule = (WB.COIN_RULES || []).filter(function (r) { return r.id === 'today-all'; })[0] || { amount: 5 };
    var got = WB.coinHasRule(date, 'today-all');
    if (st.allDone && !got) {
      return '<div class="gift-row"><span>🎉 全部完成啦！可以领取金币奖励</span>' +
        '<button class="btn primary" data-act="claim-plan-coin">🎁 领取 +' + rule.amount + ' 金币</button></div>';
    }
    if (got) return '<div class="gift-row got"><span>✅ 今日全勤金币已到账 ' + rule.amount + ' 枚</span></div>';
    return '<div class="gift-row dim"><span>还差 <b>' + (st.total - st.done) + '</b> 条就能领 ' + rule.amount + ' 枚金币啦</span></div>';
  };

  /* ---------- 今日任务：从你自己设置的任务里抽 6 条 ---------- */
  function todayHTML(date) {
    var ps = WB.dailyPlans(date);
    var st = WB.planStats(date);
    var poolN = WB.planPool(date).length;
    if (!ps.length) {
      return '<div class="empty">还没有可用于今日清单的任务。<br/>' +
        '去「强身健体 / 英语学习 / 导游学习 / 每日阅读」等板块新增任务，或在下方添加今日临时计划，它们会自动出现在这里。</div>' +
        WB.addTaskForm('today', date, { defRepeat: 'once' });
    }

    /* 每条任务按其原始类型渲染控件，与所属板块完全一致 */
    function ctlOf(p) {
      if (p.type === 'number') {
        return '<input type="number" min="0" class="pi-in num" placeholder="' + WB.esc(p.unit || '数量') +
          '" value="' + WB.esc(p.value) + '" data-act="log-value" data-id="' + p.id + '"/>' +
          (p.unit ? '<span class="pi-unit">' + WB.esc(p.unit) + (p.target ? ' / 目标 ' + p.target : '') + '</span>' : '');
      }
      if (p.type === 'select') {
        return '<select class="pi-in sel" data-act="log-value" data-id="' + p.id + '">' +
          '<option value="">未选择</option>' +
          p.options.map(function (o) {
            return '<option' + (p.value === o ? ' selected' : '') + '>' + WB.esc(o) + '</option>';
          }).join('') + '</select>';
      }
      return '';
    }

    var list = ps.map(function (p) {
      return '<div class="plan-item' + (p.done ? ' done' : '') + '" data-pid="' + p.id + '">' +
        '<button class="chk' + (p.done ? ' on' : '') + '" data-act="toggle-plan" data-id="' + p.id + '">' + CHECK + '</button>' +
        '<div class="pi-main">' +
          '<div class="pi-t">' + WB.esc(p.title) +
            (p.builtin ? '<span class="tag">必做</span>' : '') + '</div>' +
          '<div class="pi-m"><span class="tag-pill">' + WB.esc(p.secName) + '</span>' +
            (p.note ? '<span class="pi-note">' + WB.esc(p.note) + '</span>' : '') + '</div>' +
        '</div>' +
        ctlOf(p) +
        '<input type="text" class="pi-in" maxlength="60" placeholder="备注…" value="' + WB.esc(p.note) + '" data-act="plan-note" data-id="' + p.id + '"/>' +
        '</div>';
    }).join('');

    /* 自定义补充条目（当天有效） */
    var extra = WB.tasksOf('today', date);
    var gift = WB.planGiftHTML(date);
    var canRoll = poolN > 6;
    return '<div class="row-between plan-head">' +
        '<div><b>' + D.md(date) + ' 今日清单</b>　<span class="muted">从你的任务设置中抽取 · 与各板块打卡同步</span></div>' +
        (canRoll ? '<button class="btn sm" data-act="reroll-plans">🎲 换一批</button>' : '') +
      '</div>' +
      '<div class="bigbar"><i style="width:' + st.pct + '%"></i><span>' + st.done + ' / ' + st.total + '　' + st.pct + '%</span></div>' +
      list + gift +
      (extra.length ? '<hr class="sep"/><div class="tasks">' +
        extra.map(function (t) { return WB.taskRow(t, date, {}); }).join('') + '</div>' : '') +
      WB.addTaskForm('today', date, { defRepeat: 'once' }) +
      '<div class="hint">清单来自「强身健体 / 英语学习 / 导游学习 / 每日阅读」等板块的任务设置，共 ' + poolN + ' 条' +
      (canRoll ? '，这里展示其中的 ' + st.total + ' 条（必做项优先），点「换一批」切换组合' : '（不足 6 条，已全部展示）') +
      '。在这里勾选或填数值，等于在对应板块打卡，数据完全同步、永久存档。</div>';
  }

  /* ---------- 本周计划 ---------- */
  var DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

  function weekHTML(date) {
    var wk = WB.weekKeyOf(date);
    var dates = WB.weekDates(date);
    var ps = WB.weekPlansOf(date);
    var st = WB.weekPlanStats(date);

    function subList(day) {
      var arr = ps.filter(function (p) { return p.day === day; });
      if (!arr.length) return '';
      return arr.map(function (p) {
        return '<div class="plan-item sm' + (p.done ? ' done' : '') + '">' +
          '<button class="chk' + (p.done ? ' on' : '') + '" data-act="toggle-weekplan" data-id="' + p.id + '">' + CHECK + '</button>' +
          '<div class="pi-main"><div class="pi-t">' + WB.esc(p.title) + '</div></div>' +
          '<button class="ico-btn" data-act="del-weekplan" data-id="' + p.id + '">✕</button>' +
          '</div>';
      }).join('');
    }

    var groups = DAYS.map(function (day, i) {
      var d = dates[i];
      var arr = ps.filter(function (p) { return p.day === day; });
      return '<details class="wp-group"' + (arr.length ? ' open' : '') + '>' +
        '<summary><span class="wp-day">' + day + '</span>' +
          '<span class="muted">' + D.md(d) + (d === D.today() ? ' · 今天' : '') + '</span>' +
          '<span class="wp-cnt">' + (arr.filter(function (p) { return p.done; }).length) + '/' + arr.length + '</span></summary>' +
        (subList(day) || '<div class="empty sm">这天还没安排</div>') +
        '</details>';
    }).join('');

    var free = subList('');

    return '<div class="row-between plan-head">' +
        '<div><b>本周 ' + D.md(dates[0]) + ' - ' + D.md(dates[6]) + '</b>　<span class="muted">短期事务统筹</span></div>' +
        '<span class="tag-pill">已完成 ' + st.done + '/' + st.total + '</span>' +
      '</div>' +
      '<div class="bigbar"><i style="width:' + st.pct + '%"></i><span>' + st.pct + '%　本周进度</span></div>' +
      '<div class="add-row" id="wpAdd">' +
        '<input type="text" id="wpTitle" placeholder="本周要搞定的一件事，如：把导游法规过一遍" style="flex:2;min-width:200px"/>' +
        '<select id="wpDay"><option value="">不限日期</option>' +
          DAYS.map(function (d, i) { return '<option value="' + d + '">' + d + '（' + D.md(dates[i]) + '）</option>'; }).join('') +
        '</select>' +
        '<button class="btn primary" data-act="add-weekplan">+ 加入本周</button>' +
      '</div>' +
      groups +
      '<div class="wp-free"><div class="wp-free-t">不限日期</div>' +
        (free || '<div class="empty sm">还没有，加到这里的会显示为本周通用待办</div>') +
      '</div>';
  }

  /* ---------- 长期目标 ---------- */
  function goalHTML(date) {
    var gs = WB.state.goals;
    var st = WB.goalStats();

    var rows = gs.slice().sort(function (a, b) { return b.progress - a.progress; }).map(function (g) {
      return '<div class="goal-item">' +
        '<div class="row-between"><div class="gi-t">' + WB.esc(g.title) +
          (g.deadline ? ' <span class="tag-pill">截至 ' + WB.esc(g.deadline) + '</span>' : '') + '</div>' +
          '<div class="gi-r">' +
            '<span class="gi-pct" data-goal-label="' + g.id + '">' + g.progress + '%</span>' +
            '<button class="ico-btn" data-act="del-goal" data-id="' + g.id + '">✕</button>' +
          '</div></div>' +
        '<div class="gbar"><i data-goal-bar="' + g.id + '" style="width:' + g.progress + '%"></i></div>' +
        '<input type="range" class="grange" min="0" max="100" step="5" value="' + g.progress + '" ' +
          'data-act="goal-range" data-id="' + g.id + '" aria-label="' + WB.esc(g.title) + ' 进度"/>' +
        '</div>';
    }).join('');

    return '<div class="row-between plan-head">' +
        '<div><b>长期目标</b>　<span class="muted">拖动滑块调整进度 · 自动统计总进度</span></div>' +
      '</div>' +
      '<div class="goal-stats" id="goalStats">' +
        '<div><b id="gsCount">' + st.count + '</b><span>目标总数</span></div>' +
        '<div><b id="gsDone">' + st.done + '</b><span>已完成</span></div>' +
        '<div><b id="gsRate">' + st.rate + '<small>%</small></b><span>目标完成率</span></div>' +
        '<div><b id="gsAvg">' + st.avg + '<small>%</small></b><span>平均总进度</span></div>' +
      '</div>' +
      '<div class="bigbar"><i id="gsBar" style="width:' + st.avg + '%"></i><span id="gsBarTxt">总进度 ' + st.avg + '%</span></div>' +
      (rows || '<div class="empty">还没有长期目标，在下方添加第一个吧</div>') +
      '<div class="add-row">' +
        '<input type="text" id="goalTitle" placeholder="目标名称，如：导游资格证一次过 / 体脂降到 22%" style="flex:2;min-width:200px"/>' +
        '<input type="date" id="goalDeadline" title="截止日期（可选）" style="max-width:150px"/>' +
        '<button class="btn primary" data-act="add-goal">+ 添加目标</button>' +
      '</div>' +
      '<div class="hint">进度拖动后自动保存，目标总数、完成率与平均总进度会实时更新。</div>';
  }

  /* 拖动滑块时局部刷新统计，避免整页重绘打断拖动 */
  WB.refreshGoalStats = function () {
    var st = WB.goalStats();
    var set = function (id, html) { var e = document.getElementById(id); if (e) e.innerHTML = html; };
    set('gsCount', st.count);
    set('gsDone', st.done);
    set('gsRate', st.rate + '<small>%</small>');
    set('gsAvg', st.avg + '<small>%</small>');
    var bar = document.getElementById('gsBar');
    if (bar) bar.style.width = st.avg + '%';
    set('gsBarTxt', '总进度 ' + st.avg + '%');
  };

  /* =========================================================
   * 💡 灵感快捷速记
   * ========================================================= */
  WB.ideaHTML = function (date) {
    var ideas = WB.entriesOf('today', 'idea').slice(0, 8);
    return WB.card({
      title: '💡 灵感快捷速记', sub: '脑洞、随笔、一闪而过的念头 —— 随手一记，自动同步灵感随笔专区',
      right: '<span class="tag-pill">共 ' + WB.entriesOf('today', 'idea').length + ' 条</span>',
      body: '<div class="idea-row">' +
        '<textarea id="ideaInput" rows="2" placeholder="此刻在想什么？写下来就不会丢…"></textarea>' +
        '<button class="btn primary" data-act="save-idea">存入灵感库</button>' +
        '</div>' +
        '<div class="idea-list">' + (ideas.length ? ideas.map(function (e) {
          return '<div class="idea-item">' +
            '<div class="ii-t">' + WB.esc(e.title) + '</div>' +
            (e.body ? '<div class="ii-b">' + WB.esc(e.body) + '</div>' : '') +
            '<div class="ii-f"><span>' + WB.esc(e.date) + '</span>' +
            '<button class="ico-btn" data-act="del-entry" data-id="' + e.id + '">✕</button></div>' +
            '</div>';
        }).join('') : '<div class="empty sm">还没有灵感记录，想到什么先写下来</div>') + '</div>'
    });
  };

  /* =========================================================
   * 🎮 游戏化激励中心
   * ========================================================= */
  WB.gameHTML = function (date) {
    var balance = WB.coinBalance();
    var cap = WB.COIN_DAILY_CAP || 10;
    var earned = WB.coinEarnedOn(date);

    /* 金币规则清单 */
    var rules = (WB.COIN_RULES || []).map(function (r) {
      var got = WB.coinHasRule(date, r.id);
      var met = WB.coinRuleMet(r.id, date);
      var cls = got ? 'ok' : (met ? 'ready' : '');
      var tail = got ? '已到账' : (met ? (r.manual ? '可领取' : '待结算') : '未完成');
      return '<div class="coin-rule ' + cls + '">' +
        '<span class="cr-i">' + r.icon + '</span>' +
        '<div class="cr-m"><div class="cr-t">' + r.name + '</div><div class="cr-d">' + WB.esc(r.desc) + '</div></div>' +
        '<div class="cr-r"><span class="cr-a">+' + r.amount + '</span><span class="cr-s">' + tail + '</span></div>' +
        '</div>';
    }).join('');

    /* 收支流水 */
    var ledger = WB.coinLedger().slice().sort(function (a, b) { return a.ts < b.ts ? 1 : -1; }).slice(0, 6);
    var ledgerHtml = ledger.length ? ledger.map(function (l) {
      var plus = l.kind === 'earn';
      return '<div class="kv"><span>' + WB.esc(l.date) + '　' + WB.esc(l.reason) + '</span>' +
        '<span class="' + (plus ? 'coin-plus' : 'coin-minus') + '">' + (plus ? '+' : '-') + l.amount + ' 🪙</span></div>';
    }).join('') : '<div class="empty sm">还没有流水，完成打卡就有金币啦</div>';

    /* 心愿清单 */
    var wishHtml = WB.state.wishes.slice().sort(function (a, b) { return (a.redeemed ? 1 : 0) - (b.redeemed ? 1 : 0); })
      .map(function (w) {
        var can = balance >= w.cost && !w.redeemed;
        return '<div class="wish-item' + (w.redeemed ? ' done' : '') + '">' +
          '<div class="wi-m"><div class="wi-t">' + WB.esc(w.title) + '</div>' +
            '<div class="wi-c">' + w.cost + ' 🪙' + (w.redeemed ? '　·　已于 ' + w.redeemedAt + ' 兑换' : '') + '</div></div>' +
          (w.redeemed
            ? '<span class="tag-pill">已兑换</span>'
            : '<button class="btn sm ' + (can ? 'primary' : '') + '" data-act="redeem-wish" data-id="' + w.id + '"' + (can ? '' : ' disabled') + '>兑换</button>') +
          '<button class="ico-btn" data-act="del-wish" data-id="' + w.id + '">✕</button>' +
          '</div>';
      }).join('') || '<div class="empty sm">还没有心愿，添加一个想奖励自己的东西吧</div>';

    /* 打卡体系 */
    var readStreak = WB.streak('reading', date);
    var learnDays = Object.keys(WB.studyCheckDays()).length;
    var monthGrid = WB.monthGrid(date);
    var monthAct = monthGrid.filter(function (c) { return c.active; }).length;
    var heat = monthGrid.map(function (c) {
      return '<div class="heat-cell ' + (c.active ? 'l2' : 'l0') + '" title="' + c.date + (c.active ? ' · 已运动打卡' : ' · 未打卡') + '">' +
        '<span class="hi">' + (c.active ? '💗' : '·') + '</span><small>' + c.day + '</small></div>';
    }).join('');

    var html = '';
    html += '<div class="grid g2">';

    html += WB.card({
      title: '🪙 金币中心', sub: '每日上限 ' + cap + ' 枚 · 轻量化激励不内卷',
      right: '<span class="tag-pill">今日已赚 ' + earned + '/' + cap + '</span>',
      body: '<div class="coin-big"><span class="cb-n">' + balance + '</span><span class="cb-u">🪙 金币余额</span></div>' +
        '<div class="coin-bar"><i style="width:' + Math.min(100, earned / cap * 100) + '%"></i></div>' +
        '<div class="hint" style="margin:6px 0 10px">今日还可获得 <b>' + Math.max(0, cap - earned) + '</b> 枚</div>' +
        rules
    });

    html += WB.card({
      title: '🎀 心愿清单', sub: '攒够金币就兑换，记录全部收支历史',
      body: '<div class="add-row" style="border-top:none;padding-top:0;margin-top:0">' +
        '<input type="text" id="wishTitle" placeholder="想要什么奖励？如：看一场电影" style="flex:2;min-width:160px"/>' +
        '<input type="number" id="wishCost" placeholder="金币" min="1" style="max-width:100px"/>' +
        '<button class="btn primary" data-act="add-wish">+ 添加</button></div>' +
        '<div class="wish-list">' + wishHtml + '</div>' +
        '<hr class="sep"/>' +
        '<div class="k" style="font-size:11.5px;color:var(--muted);margin-bottom:6px">最近收支</div>' +
        ledgerHtml
    });

    html += '</div>';

    html += WB.card({
      title: '📅 打卡体系', sub: '阅读连续 · 学习累计 · 月度运动热力图',
      body: '<div class="grid g3">' +
          WB.stat('阅读连续打卡', readStreak + '<small>天</small>', '每天读一点就不断签', 'accent') +
          WB.stat('学习累计打卡', learnDays + '<small>天</small>', '英语 + 导游合计', 'blue') +
          WB.stat('本月运动打卡', monthAct + '<small>天</small>', date.slice(0, 7), 'amber') +
        '</div>' +
        '<div class="k" style="font-size:11.5px;color:var(--muted);margin:10px 0 6px">' + date.slice(0, 7) + ' 运动打卡热力图（💗 = 当天有运动记录）</div>' +
        '<div class="heat">' + heat + '</div>'
    });

    return html;
  };
})();

</script>
<script>
/* ============================================================
 * charts-review.js —— 每日复盘板块的 Chart.js 图表（粉色系 + 透明背景）
 * 数据来源：store.js 的统计函数，全部取自本机 localStorage 打卡记录
 * Chart.js 由 CDN 提供（见 index.html），离线时显示可爱的降级提示
 * ============================================================ */
(function () {
  var PINK = '#FF9EB5';        // 主色
  var PINK_2 = '#FFC0CB';      // 辅助 1
  var PINK_3 = '#FFB6C1';      // 辅助 2
  var PINK_4 = '#FFD6E3';      // 辅助 3
  var INK = '#a98e9a';         // 轴文字色
  var GRID = 'rgba(255,182,193,.35)';

  var CHART_CDN = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';
  var instances = [];

  /* 确保 Chart.js 已就绪（未加载则临时注入 CDN 再回调） */
  function ensureChart(cb) {
    if (typeof Chart !== 'undefined') { cb(true); return; }
    var s = document.createElement('script');
    s.src = CHART_CDN;
    s.onload = function () { cb(typeof Chart !== 'undefined'); };
    s.onerror = function () { cb(false); };
    document.head.appendChild(s);
  }

  /* Chart.js 不可用时：用可爱的提示代替白屏 */
  function failUI() {
    var boxes = document.querySelectorAll('.chart-box');
    Array.prototype.forEach.call(boxes, function (b) {
      b.innerHTML = '<div class="news-fail slim">' +
        '<div class="nf-ico">🎀</div>' +
        '<div class="nf-t">哎呀，图表加载失败了</div>' +
        '<div class="nf-d">检查网络后点下面的按钮重试，打卡数据本身不受影响哦</div>' +
        '<div class="nf-b"><button class="btn" data-act="retry-charts">重新加载图表</button></div>' +
        '</div>';
    });
  }

  function baseOpts(decimal) {
    return {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(255,158,181,.95)',
          titleColor: '#fff', bodyColor: '#fff',
          borderColor: '#fff', borderWidth: 1,
          padding: 10, cornerRadius: 12, displayColors: false,
          callbacks: {
            label: function (c) {
              var v = c.parsed.y != null ? c.parsed.y : c.parsed.x;
              return (decimal ? v + '%' : v);
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: GRID, drawBorder: false },
          ticks: { color: INK, font: { size: 10 } }
        },
        y: {
          beginAtZero: true,
          grid: { color: GRID, drawBorder: false },
          ticks: { color: INK, font: { size: 10 } }
        }
      },
      animation: { duration: 500 }
    };
  }

  function mk(id, cfg) {
    var el = document.getElementById(id);
    if (!el) return;
    instances.push(new Chart(el.getContext('2d'), cfg));
  }

  function gradient(ctx, h) {
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, 'rgba(255,158,181,.45)');
    g.addColorStop(1, 'rgba(255,214,227,.05)');
    return g;
  }

  WB.buildReviewCharts = function (date) {
    ensureChart(function (ok) {
      if (!ok) { failUI(); return; }
      try { drawAll(date); }
      catch (e) {
        console.warn('图表绘制失败', e);
        failUI();
      }
    });
  };

  /* 实际绘制三张图 */
  function drawAll(date) {
      instances.forEach(function (c) { try { c.destroy(); } catch (e) { } });
      instances = [];

      if (Chart.defaults) {
        Chart.defaults.color = INK;
        Chart.defaults.font.family = '-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
        Chart.defaults.font.size = 11;
      }

      var D = WB.date;
      var last7 = D.lastNDates(7, date);
      var rate7 = last7.map(function (d) { return WB.progress(d).pct; });
      var fit7 = last7.map(function (d) { return WB.sectionActive('fitness', d) ? 1 : 0; });
      var weekStats = WB.weekSectionStats(date);
      var labels = last7.map(function (d) { return D.md(d); });

      /* 1. 近 7 天待办完成率折线图 */
      var elRate = document.getElementById('chartRate7');
      if (elRate) {
        var ctx = elRate.getContext('2d');
        mk('chartRate7', {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: '完成率',
              data: rate7,
              borderColor: PINK,
              backgroundColor: gradient(ctx, 200),
              fill: true, tension: 0.35, borderWidth: 2.5,
              pointBackgroundColor: PINK, pointBorderColor: '#fff', pointBorderWidth: 2,
              pointRadius: 4, pointHoverRadius: 6
            }]
          },
          options: (function () {
            var o = baseOpts(true);
            o.scales.y.max = 100;
            o.scales.y.ticks.stepSize = 25;
            o.scales.y.ticks.callback = function (v) { return v + '%'; };
            return o;
          })()
        });
      }

      /* 2. 近 7 天运动打卡天数柱状图 */
      if (document.getElementById('chartFit7')) {
        mk('chartFit7', {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: '运动打卡',
              data: fit7,
              backgroundColor: fit7.map(function (v) { return v ? PINK : PINK_4; }),
              borderRadius: 10, borderSkipped: false, barThickness: 'flex', maxBarThickness: 34
            }]
          },
          options: (function () {
            var o = baseOpts(false);
            o.scales.y.max = 1;
            o.scales.y.ticks.stepSize = 1;
            o.scales.y.ticks.callback = function (v) { return v ? '已打卡' : '休息'; };
            return o;
          })()
        });
      }

      /* 3. 本周各模块学习记录统计（横向柱状） */
      if (document.getElementById('chartWeekSec')) {
        var pal = [PINK, PINK_3, PINK_2, PINK_4, PINK, PINK_3, PINK_2];
        mk('chartWeekSec', {
          type: 'bar',
          data: {
            labels: weekStats.map(function (w) { return w.name; }),
            datasets: [{
              label: '打卡次数',
              data: weekStats.map(function (w) { return w.count; }),
              backgroundColor: weekStats.map(function (w, i) { return pal[i % pal.length]; }),
              borderRadius: 10, borderSkipped: false, maxBarThickness: 22
            }]
          },
          options: (function () {
            var o = baseOpts(false);
            o.indexAxis = 'y';
            o.scales.x.ticks.stepSize = 1;
            o.scales.x.ticks.precision = 0;
            return o;
          })()
        });
      }
  }
})();

</script>
<script>
/* ============================================================
 * sync.js —— 云端同步（手机 / 电脑共用一份数据）
 *
 * 两种后端，任选其一：
 *   1) GitHub Gist（推荐，永久免费、私有）：只需要在 GitHub 生成一个
 *      仅勾选 gist 权限的 Token，填进设置面板即可。
 *   2) 自定义 HTTP 接口：任何支持 GET 取 JSON / PUT 或 POST 写 JSON 的
 *      服务都行（自建 Cloudflare Worker、KVDB、jsonblob…）。
 *
 * 同步策略（合并式，不怕覆盖）：
 *   - 打开页面：自动拉取云端并「合并」到本地（打卡/记录按时间戳取新，永不删数据）
 *   - 改动数据：防抖 3 秒后自动上传
 *   - 也可随时手动点「立即上传 / 立即下载」
 * 配置（含 Token）单独存放，不会进入导出的备份文件。
 * ============================================================ */
(function () {
  var CFG_KEY = 'wb-sync-v1';
  var FILE_NAME = 'wb-discipline.json';
  var PUSH_DELAY = 3000;          // 改动后自动上传的防抖时间
  var applying = false;           // 合并/拉取中，避免触发回传
  var pushTimer = null;

  /* ---------------- 配置读写 ---------------- */
  var cfg = (function () {
    try {
      var o = JSON.parse(WB.LS.getItem(CFG_KEY) || '{}');
      return {
        provider: o.provider || 'gist',     // gist | custom
        auto: o.auto !== false,             // 自动同步开关
        token: o.token || '',               // GitHub Token（仅 gist 权限）
        gistId: o.gistId || '',             // 留空则首次上传时自动新建
        endpoint: o.endpoint || '',         // 自定义接口地址
        device: o.device || '',
        lastSync: o.lastSync || ''
      };
    } catch (e) {
      return { provider: 'gist', auto: true, token: '', gistId: '', endpoint: '', device: '', lastSync: '' };
    }
  })();

  function saveCfg() { try { WB.LS.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) { } }
  function ready() {
    if (!cfg.auto) return false;
    return cfg.provider === 'gist' ? !!cfg.token : !!cfg.endpoint;
  }

  /* ---------------- 合并：把远端数据并入本地（只增不删） ---------------- */
  WB.mergeRemote = function (remote) {
    if (!remote || typeof remote !== 'object') throw new Error('云端数据格式不正确');
    var S = WB.state, i, k;

    /* 任务：按 id 去重，取字段较新的一份 */
    var tmap = {};
    S.tasks.forEach(function (t) { tmap[t.id] = t; });
    (remote.tasks || []).forEach(function (rt) {
      var cur = tmap[rt.id];
      if (!cur) { S.tasks.push(rt); tmap[rt.id] = rt; return; }
      var a = Date.parse(cur.createdAt || 0) || 0;
      var b = Date.parse(rt.createdAt || 0) || 0;
      if (b > a) { for (k in rt) cur[k] = rt[k]; }
    });

    /* 打卡日志：按 日期+任务 取时间戳较新的一份 */
    for (var d in (remote.logs || {})) {
      S.logs[d] = S.logs[d] || {};
      var rd = remote.logs[d];
      for (k in rd) {
        var cur2 = S.logs[d][k];
        if (!cur2) { S.logs[d][k] = rd[k]; continue; }
        if ((Date.parse(rd[k].ts || 0) || 0) > (Date.parse(cur2.ts || 0) || 0)) S.logs[d][k] = rd[k];
      }
    }

    /* 文字记录：按 id 取较新的一份 */
    var emap = {};
    S.entries.forEach(function (e) { emap[e.id] = e; });
    (remote.entries || []).forEach(function (re) {
      if (!re || !re.id) return;
      var cur3 = emap[re.id];
      if (!cur3) { S.entries.push(re); emap[re.id] = re; }
      else if ((Date.parse(re.ts || 0) || 0) > (Date.parse(cur3.ts || 0) || 0)) {
        for (k in re) cur3[k] = re[k];
      }
    });

    /* 草稿（复盘/周评长文本）：本地为空时用远端补齐 */
    for (var sc in (remote.drafts || {})) {
      S.drafts[sc] = S.drafts[sc] || {};
      var rdd = remote.drafts[sc];
      for (k in rdd) { if (!S.drafts[sc][k]) S.drafts[sc][k] = rdd[k]; }
    }

    /* 设置：只补本地没有的项 */
    for (k in (remote.settings || {})) {
      if (S.settings[k] === undefined) S.settings[k] = remote.settings[k];
    }

    /* 计划换批偏移量：取较大的一份（哪台设备换得多就用哪台的） */
    var rs = remote.settings && remote.settings.planSeed;
    if (rs) {
      S.settings.planSeed = S.settings.planSeed || {};
      for (var pd in rs) S.settings.planSeed[pd] = Math.max(S.settings.planSeed[pd] || 0, rs[pd] || 0);
    }

    /* 金币 / 心愿 / 目标 / 周计划：按 id 去重合并 */
    if (WB.mergeExtras) WB.mergeExtras(remote);

    return S;
  };

  /* 本地快照（不含任何 Token 等同步配置） */
  function snapshot() {
    var s = JSON.parse(JSON.stringify(WB.state));
    s._sync = { device: cfg.device || '未命名设备', at: new Date().toISOString() };
    return s;
  }

  /* ---------------- 后端：GitHub Gist ---------------- */
  var gist = {
    headers: function () {
      return {
        'Authorization': 'token ' + cfg.token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      };
    },
    get: function () {
      if (!cfg.gistId) return Promise.reject(new Error('还没有云端存档 ID，请先点「新建 / 上传」'));
      return fetch('https://api.github.com/gists/' + cfg.gistId + '?_t=' + Date.now(), { headers: gist.headers() })
        .then(function (r) {
          if (!r.ok) return r.text().then(function (t) { throw new Error('读取失败 ' + r.status + '：' + (r.status === 401 ? 'Token 无效或已过期' : t.slice(0, 80))); });
          return r.json();
        })
        .then(function (j) {
          var key = Object.keys(j.files || {})[0];
          if (!key) throw new Error('云端存档里没有文件');
          var f = j.files[key];
          if (f.truncated) {                     // 内容过大时改用 raw 地址再取一次
            return fetch(f.raw_url + '?_t=' + Date.now()).then(function (r) { return r.text(); })
              .then(function (t) { return JSON.parse(t); });
          }
          return JSON.parse(f.content);
        });
    },
    put: function (data) {
      var body = { description: '自律工作台 · 数据存档', public: false, files: {} };
      body.files[FILE_NAME] = { content: JSON.stringify(data, null, 2) };
      var url = cfg.gistId ? 'https://api.github.com/gists/' + cfg.gistId : 'https://api.github.com/gists';
