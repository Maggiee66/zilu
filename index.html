      return fetch(url, {
        method: cfg.gistId ? 'PATCH' : 'POST',
        headers: gist.headers(),
        body: JSON.stringify(body)
      }).then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error('上传失败 ' + r.status + '：' + (r.status === 401 ? 'Token 无效或缺少 gist 权限' : t.slice(0, 80))); });
        return r.json();
      }).then(function (j) {
        if (!cfg.gistId && j.id) { cfg.gistId = j.id; saveCfg(); }
        return j;
      });
    }
  };

  /* ---------------- 后端：自定义 HTTP 接口 ---------------- */
  var custom = {
    get: function () {
      return fetch(cfg.endpoint + (cfg.endpoint.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now())
        .then(function (r) { if (!r.ok) throw new Error('读取失败 ' + r.status); return r.json(); });
    },
    put: function (data) {
      var body = JSON.stringify(data);
      return fetch(cfg.endpoint, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: body
      }).then(function (r) {
        if (r.ok) return true;
        if (r.status === 405 || r.status === 404) {     // 部分服务只接受 POST
          return fetch(cfg.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body })
            .then(function (r2) { if (!r2.ok) throw new Error('上传失败 ' + r2.status); return true; });
        }
        throw new Error('上传失败 ' + r.status);
      });
    }
  };

  function api() { return cfg.provider === 'gist' ? gist : custom; }

  /* ---------------- 对外动作 ---------------- */
  function pull(silent) {
    if (!ready()) return Promise.reject(new Error('还没配置同步'));
    return api().get().then(function (remote) {
      applying = true;
      WB.mergeRemote(remote);
      WB.saveNow();
      cfg.lastSync = new Date().toLocaleString('zh-CN', { hour12: false });
      saveCfg();
      applying = false;
      if (!silent) WB.toast('已拉取云端数据并合并', 'ok');
      if (WB.renderAll) WB.renderAll();
      return remote;
    }).catch(function (e) {
      applying = false;
      throw e;
    });
  }

  function push(silent) {
    if (!ready()) return Promise.reject(new Error('还没配置同步'));
    return api().put(snapshot()).then(function () {
      cfg.lastSync = new Date().toLocaleString('zh-CN', { hour12: false });
      saveCfg();
      if (!silent) WB.toast('已上传到云端', 'ok');
      return true;
    });
  }

  /* 数据变更后防抖上传（合并过程中不触发） */
  function markDirty() {
    if (applying || !ready()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () { push(true).catch(function () { }); }, PUSH_DELAY);
  }

  /* ---------------- 设置面板 ---------------- */
  function panelHTML() {
    var st = cfg.lastSync ? ('上次同步：' + cfg.lastSync) : '尚未同步过';
    return '<div class="field"><label>同步方式</label>' +
      '<select id="syProvider">' +
        '<option value="gist"' + (cfg.provider === 'gist' ? ' selected' : '') + '>GitHub 私有 Gist（推荐，永久免费）</option>' +
        '<option value="custom"' + (cfg.provider === 'custom' ? ' selected' : '') + '>自定义 HTTP 接口（GET 取 / PUT 写）</option>' +
      '</select></div>' +
      '<div class="field"><label>GitHub Token <span>只需勾选 gist 权限；只存在本机</span></label>' +
        '<input id="syToken" type="password" placeholder="ghp_xxx…" value="' + WB.esc(cfg.token) + '"/></div>' +
      '<div class="field"><label>Gist ID <span>留空则首次上传时自动创建</span></label>' +
        '<input id="syGist" type="text" placeholder="留空自动新建" value="' + WB.esc(cfg.gistId) + '"/></div>' +
      '<div class="field"><label>自定义接口地址 <span>选「自定义接口」时必填</span></label>' +
        '<input id="syEndpoint" type="text" placeholder="https://你的接口地址" value="' + WB.esc(cfg.endpoint) + '"/></div>' +
      '<div class="field"><label>设备名 <span>便于区分手机 / 电脑</span></label>' +
        '<input id="syDevice" type="text" placeholder="如：我的 iPhone" value="' + WB.esc(cfg.device) + '"/></div>' +
      '<label class="row-between" style="margin:6px 0 12px">' +
        '<span>开启自动同步（打开时拉取，改动后自动上传）</span>' +
        '<input id="syAuto" type="checkbox"' + (cfg.auto ? ' checked' : '') + '/></label>' +
      '<div class="sync-actions">' +
        '<button class="btn" id="syTest">测试连接</button>' +
        '<button class="btn" id="syDown">立即下载合并</button>' +
        '<button class="btn primary" id="syUp">立即上传</button>' +
      '</div>' +
      '<div class="sync-actions">' +
        '<button class="btn" id="syCode">生成同步码（给另一台设备）</button>' +
        '<button class="btn" id="syImport">粘贴同步码</button>' +
      '</div>' +
      '<div class="sync-msg" id="syMsg">' + WB.esc(st) + '</div>' +
      '<div class="hint">用法：在手机和电脑上打开同一个网址，各自填一次同步设置即可。' +
      'Token 只需勾选 <b>gist</b> 权限，仅保存在本机，不会写进导出的备份文件。</div>';
  }

  function readForm() {
    cfg.provider = document.getElementById('syProvider').value;
    cfg.token = document.getElementById('syToken').value.trim();
    cfg.gistId = document.getElementById('syGist').value.trim();
    cfg.endpoint = document.getElementById('syEndpoint').value.trim();
    cfg.device = document.getElementById('syDevice').value.trim();
    cfg.auto = document.getElementById('syAuto').checked;
    saveCfg();
  }

  function msg(t, ok) {
    var el = document.getElementById('syMsg');
    if (el) { el.textContent = t; el.className = 'sync-msg ' + (ok ? 'ok' : (ok === false ? 'err' : '')); }
  }

  WB.openSyncPanel = function () {
    WB.modal({
      title: '☁️ 云端同步设置', body: panelHTML(), okText: '保存设置',
      onOk: function () {
        readForm();
        WB.toast('同步设置已保存', 'ok');
        if (ready()) pull(true).catch(function (e) { WB.toast('拉取失败：' + e.message, 'err'); });
      }
    });
    /* 面板里的三个操作按钮 */
    document.getElementById('syTest').onclick = function () {
      readForm(); msg('正在测试…');
      api().get().then(function (r) {
        msg('连接成功 ✅ 云端有 ' + ((r.tasks || []).length) + ' 条任务、' + ((r.entries || []).length) + ' 条记录', true);
      }).catch(function (e) { msg('连接失败：' + e.message, false); });
    };
    document.getElementById('syDown').onclick = function () {
      readForm(); msg('正在拉取…');
      pull().then(function (r) {
        msg('已合并云端数据：任务 ' + ((r.tasks || []).length) + ' 条 / 记录 ' + ((r.entries || []).length) + ' 条', true);
      }).catch(function (e) { msg('拉取失败：' + e.message, false); });
    };
    document.getElementById('syUp').onclick = function () {
      readForm(); msg('正在上传…');
      push().then(function () {
        msg('上传成功 ✅ ' + (cfg.lastSync || '') + (cfg.gistId ? '｜Gist ID 已自动保存' : ''), true);
      }).catch(function (e) { msg('上传失败：' + e.message, false); });
    };
    document.getElementById('syCode').onclick = function () {
      readForm();
      var code = syncCode();
      var el = document.getElementById('syMsg');
      if (el) {
        el.className = 'sync-msg';
        el.innerHTML = '<div style="margin-bottom:6px">复制下面这段同步码，在另一台设备点「粘贴同步码」即可（含 Token，请勿外传）：</div>' +
          '<textarea rows="3" style="width:100%;font-size:11px">' + WB.esc(code) + '</textarea>';
      }
      if (navigator.clipboard) navigator.clipboard.writeText(code).catch(function () { });
    };
    document.getElementById('syImport').onclick = function () {
      WB.form('粘贴同步码', [
        { k: 'code', t: '同步码', type: 'textarea', rows: 3, ph: '粘贴另一台设备生成的同步码…' }
      ], '应用').then(function (r) {
        if (!r || !r.code) return;
        try {
          applyCode(r.code.trim());
          saveCfg();
          WB.toast('同步配置已应用', 'ok');
          setTimeout(function () { WB.openSyncPanel(); }, 60);
        } catch (e) {
          WB.toast('同步码无效：' + e.message, 'err');
        }
      });
    };
  };

  /* 同步码：把配置打包成一段字符串，方便第二台设备一键接入 */
  function syncCode() {
    var o = { p: cfg.provider, t: cfg.token, g: cfg.gistId, e: cfg.endpoint, d: cfg.device };
    return btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  }
  function applyCode(code) {
    var o = JSON.parse(decodeURIComponent(escape(atob(code))));
    if (!o || typeof o !== 'object') throw new Error('格式不正确');
    cfg.provider = o.p || 'gist';
    cfg.token = o.t || '';
    cfg.gistId = o.g || '';
    cfg.endpoint = o.e || '';
    cfg.device = o.d || '';
    return cfg;
  }

  /* ---------------- 初始化：挂载自动同步 ---------------- */
  WB.sync = {
    cfg: cfg, saveCfg: saveCfg, pull: pull, push: push,
    markDirty: markDirty, ready: ready,
    statusText: function () { return cfg.lastSync ? '上次同步 ' + cfg.lastSync : '未同步'; }
  };

  /* 包装 save：任何数据改动后触发防抖上传 */
  var origSave = WB.save, origSaveNow = WB.saveNow;
  WB.save = function () { origSave(); markDirty(); };
  WB.saveNow = function () { origSaveNow(); markDirty(); };

  /* 启动时自动拉取一次 */
  if (ready()) {
    setTimeout(function () {
      pull(true).then(function () {
        WB.toast('已同步云端数据', 'ok');
      }).catch(function (e) {
        WB.toast('云端同步失败：' + e.message, 'err');
      });
    }, 800);
  }

  /* 回到页面时（切回标签/解锁手机）再拉一次，保证看到的是最新的 */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && ready()) pull(true).catch(function () { });
  });
})();

</script>
<script>
/* ============================================================
 * splash.js —— 启动页（Splash Screen）
 * 每天首次打开展示：日期星期 + 问候语（可自定义）+ 随机夸赞金句
 * 点击「开始今天」进入工作台。
 * 维护：assets/js/data.js 的 WB.PRAISES 可增删夸赞句子。
 * ============================================================ */
(function () {
  var D = WB.date;
  var wrap = null;

  /* 随机一句夸赞（同一天每次刷新不一定相同，点「换个夸法」可重抽） */
  WB.randomPraise = function () {
    var arr = WB.PRAISES || ['今天也要好好加油呀 🎀'];
    return arr[Math.floor(Math.random() * arr.length)];
  };

  function html(today) {
    var d = D.parse(today);
    var dateLine = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
    var weekLine = D.weekday(today);
    var greet = WB.state.settings.greeting || '嗨，老板大人';
    var bal = WB.coinBalance ? WB.coinBalance() : 0;
    var seq = WB.streakAny ? WB.streakAny(today) : 0;
    return '' +
      '<div class="sp-card">' +
        '<div class="sp-bow">🎀</div>' +
        '<div class="sp-date">' + dateLine + '</div>' +
        '<div class="sp-week">' + weekLine + '　·　' + '自律工作台' + '</div>' +
        '<div class="sp-greet-row">' +
          '<div class="sp-greet" id="spGreet">' + WB.esc(greet) + '</div>' +
          '<button class="sp-edit" id="spEdit" title="自定义问候语">✏️</button>' +
        '</div>' +
        '<div class="sp-praise" id="spPraise">' + WB.esc(WB.randomPraise()) + '</div>' +
        '<div class="sp-mini">' +
          '<span>🪙 金币 ' + bal + '</span>' +
          '<span>🔥 连续打卡 ' + seq + ' 天</span>' +
        '</div>' +
        '<button class="sp-btn" id="spStart">开始今天 →</button>' +
        '<div class="sp-foot">' +
          '<button class="sp-link" id="spReroll">🎲 换个夸法</button>' +
          '<span class="sp-dot">·</span>' +
          '<button class="sp-link" id="spOff">今天不再自动弹出</button>' +
        '</div>' +
      '</div>';
  }

  WB.showSplash = function () {
    if (wrap) return;
    var today = D.today();
    wrap = document.createElement('div');
    wrap.className = 'splash';
    wrap.innerHTML = html(today);
    document.body.appendChild(wrap);
    document.body.classList.add('splash-on');

    var praiseEl = wrap.querySelector('#spPraise');
    wrap.querySelector('#spReroll').onclick = function () {
      praiseEl.classList.remove('pop');
      void praiseEl.offsetWidth;
      praiseEl.textContent = WB.randomPraise();
      praiseEl.classList.add('pop');
    };
    wrap.querySelector('#spEdit').onclick = function () {
      WB.form('自定义问候语', [
        { k: 'g', t: '启动页问候语', ph: '如：嗨，老板大人', value: WB.state.settings.greeting || '' }
      ], '保存').then(function (r) {
        if (!r || !r.g) return;
        WB.state.settings.greeting = r.g;
        WB.save();
        /* 回调是异步的，期间启动页可能已被关闭，这里做一次存在性兜底 */
        var host = wrap || document.querySelector('.splash');
        var gEl = host && host.querySelector('#spGreet');
        if (gEl) gEl.textContent = r.g;
        WB.toast('问候语已更新', 'ok');
      });
    };
    wrap.querySelector('#spOff').onclick = function () {
      WB.state.settings.splashOff = true;
      WB.save();
      WB.toast('已设置：以后不再自动弹出启动页');
    };
    wrap.querySelector('#spStart').onclick = function () {
      WB.closeSplash();
    };
  };

  WB.closeSplash = function () {
    if (!wrap) return;
    WB.state.settings.splashDate = D.today();
    WB.save();
    wrap.classList.add('out');
    var el = wrap;
    wrap = null;
    document.body.classList.remove('splash-on');
    setTimeout(function () { el.remove(); }, 420);
    if (WB.renderAll) WB.renderAll();
  };

  /* 是否需要弹出：每天一次 */
  WB.maybeSplash = function () {
    var s = WB.state.settings;
    if (s.splashOff) return false;
    if (s.splashDate === D.today()) return false;
    WB.showSplash();
    return true;
  };
})();

</script>
<script>
/* ============================================================
 * app.js —— 路由 / 交互 / 事件中枢
 * ============================================================ */
(function () {
  var D = WB.date;
  var cur = { section: 'today', date: D.today() };
  WB.current = cur;

  var view = document.getElementById('view');
  var nav = document.getElementById('nav');
  var pageTitle = document.getElementById('pageTitle');
  var pageSub = document.getElementById('pageSub');
  var datePicker = document.getElementById('datePicker');

  /* ---------------- 渲染 ---------------- */
  function renderNav() {
    nav.innerHTML = WB.SECTIONS.map(function (s, i) {
      var p = (s.id === 'today' || s.id === 'history') ? null : WB.progress(cur.date, [s.id]);
      var dot = p ? (p.pct > 0 ? (p.pct >= 100 ? ' done' : ' half') : '') : '';
      return '<button class="nav-item' + (cur.section === s.id ? ' active' : '') + '" data-nav="' + s.id + '">' +
        '<span class="nav-ico">' + (s.icon || '🎀') + '</span>' +
        '<span class="nav-idx">' + (i + 1) + '</span>' +
        '<span class="nav-name">' + s.name + '</span>' +
        '<span class="nav-dot' + dot + '"></span>' +
        '</button>';
    }).join('');
  }

  /* 今日清单的局部刷新：勾选 / 填数值后更新条目样式、进度条、奖励条、金币与侧栏 */
  function patchPlanUI() {
    var map = {};
    WB.dailyPlans(cur.date).forEach(function (p) { map[p.id] = p; });
    Array.prototype.forEach.call(view.querySelectorAll('.plan-item[data-pid]'), function (el) {
      var p = map[el.getAttribute('data-pid')];
      if (!p) return;
      el.classList.toggle('done', p.done);
      var c = el.querySelector('.chk');
      if (c) c.classList.toggle('on', p.done);
    });

    var st = WB.planStats(cur.date);
    var bb = view.querySelector('.bigbar');
    if (bb) {
      var bi = bb.querySelector('i'); if (bi) bi.style.width = st.pct + '%';
      var bs = bb.querySelector('span'); if (bs) bs.textContent = st.done + ' / ' + st.total + '　' + st.pct + '%';
    }

    var gr = view.querySelector('.gift-row');
    if (gr && WB.planGiftHTML) gr.outerHTML = WB.planGiftHTML(cur.date);

    WB.settleCoins(cur.date);
    var cn = document.getElementById('coinNum');
    if (cn) cn.textContent = WB.coinBalance();
    var pp = WB.progress(cur.date);
    document.getElementById('sideToday').textContent = pp.done + ' / ' + pp.total;
    renderNav();
    WB.save();
  }

  function render() {
    var sec = WB.SECTIONS.filter(function (s) { return s.id === cur.section; })[0];
    pageTitle.textContent = sec.name;
    pageSub.textContent = sec.sub + '　·　' + D.md(cur.date) + ' ' + D.weekday(cur.date) + (cur.date === D.today() ? '' : '（回溯）');
    datePicker.value = cur.date;
    var fn = WB.render[cur.section];
    view.innerHTML = '<div class="view-inner">' + (fn ? fn(cur.date) : '<div class="empty">板块建设中</div>') + '</div>';
    renderNav();
    var p = WB.progress(cur.date);
    document.getElementById('sideToday').textContent = p.done + ' / ' + p.total;
    var ex = WB.examInfo();
    document.getElementById('countdownChip').textContent = '距导游考试 ' + ex.left + ' 天';
    /* 顶栏金币余额 */
    var cn = document.getElementById('coinNum');
    if (cn) cn.textContent = WB.coinBalance();
    view.scrollTop = 0;
    WB.state.meta.lastSection = cur.section;
    WB.save();
    /* 板块渲染完成后的后置钩子：新闻拉取 / 图表绘制 */
    if (WB.afterRender && WB.afterRender[cur.section]) {
      try { WB.afterRender[cur.section](cur.date); } catch (e) { console.warn('afterRender 异常', cur.section, e); }
    }
  }
  WB.renderAll = render;
  WB.goto = function (id) { cur.section = id; render(); };

  /* ---------------- 顶部操作 ---------------- */
  datePicker.addEventListener('change', function () {
    cur.date = datePicker.value || D.today();
    render();
  });
  document.getElementById('btnToday').addEventListener('click', function () {
    cur.date = D.today(); render();
  });
  document.getElementById('btnSync').addEventListener('click', function () {
    if (WB.openSyncPanel) WB.openSyncPanel();
  });
  document.getElementById('btnCoins').addEventListener('click', function () {
    WB.goto('today');
    setTimeout(function () {
      var el = document.querySelector('.plan-card');
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 60);
  });
  document.getElementById('btnExport').addEventListener('click', function () {
    WB.exportJSON(); WB.toast('已导出备份文件', 'ok');
  });
  document.getElementById('importFile').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      function doImport(mode) {
        try {
          WB.importJSON(r.result, mode);
          WB.toast('导入成功', 'ok');
          render();
        } catch (err) {
          WB.toast('导入失败：' + err.message, 'err');
        }
      }
      WB.confirm('导入数据', '确定 = 合并到现有数据（推荐，重复内容自动跳过）。\n若想用备份文件完全覆盖当前数据，请点「取消」后选择覆盖。').then(function (merge) {
        if (merge) return doImport('merge');
        WB.confirm('覆盖导入', '覆盖将清空当前工作台的全部数据，建议先「导出备份」。确定继续覆盖？').then(function (ok2) {
          if (ok2) doImport('replace');
        });
      });
    };
    r.readAsText(f);
    e.target.value = '';
  });
  document.getElementById('btnResetDay').addEventListener('click', function () {
    WB.confirm('重置当日', '将清空 ' + cur.date + ' 的所有打卡勾选与数值（文字记录、知识库等内容不会删除）。确定继续？').then(function (ok) {
      if (!ok) return;
      WB.clearDay(cur.date);
      WB.toast('已重置 ' + cur.date + ' 的打卡记录');
      render();
    });
  });
  nav.addEventListener('click', function (e) {
    var b = e.target.closest('[data-nav]');
    if (!b) return;
    cur.section = b.getAttribute('data-nav');
    render();
  });

  /* ---------------- 任务操作 ---------------- */
  function addTaskFrom(scopeEl) {
    var section = scopeEl.getAttribute('data-section');
    var val = function (k) {
      var el = scopeEl.querySelector('[data-f="' + k + '"]');
      return el ? el.value.trim() : '';
    };
    var title = val('title');
    if (!title) { WB.toast('请先填写任务名称', 'err'); return; }
    var type = val('type') || 'check';
    var opts = val('options') ? val('options').split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean) : null;
    WB.addTask({
      section: section, title: title, type: type,
      unit: type === 'number' ? (val('unit') || '') : '',
      target: val('target') ? parseFloat(val('target')) : null,
      options: type === 'select' ? (opts || ['已完成', '未完成']) : null,
      repeat: val('repeat') || 'daily',
      date: cur.date, noteHint: '备注'
    });
    WB.toast('已新增：' + title, 'ok');
    render();
  }

  function addEntryFrom(scopeEl) {
    var section = scopeEl.getAttribute('data-section');
    var type = scopeEl.getAttribute('data-type') || 'note';
    var val = function (k) {
      var el = scopeEl.querySelector('[data-f="' + k + '"]');
      return el ? el.value.trim() : '';
    };
    var title = val('title');
    if (!title) { WB.toast('请先填写标题', 'err'); return; }
    var meta = {};
    if (val('source')) meta.source = val('source');
    if (val('minutes')) meta.minutes = parseFloat(val('minutes'));
    WB.addEntry({
      section: section, type: type, date: cur.date,
      title: title, body: val('body'), tag: val('tag') || '', meta: meta
    });
    WB.toast('已存入存档', 'ok');
    render();
  }

  /* ---------------- 事件委托 ---------------- */
  view.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');

    /* 外部资源跳转：url 留空时提示填入真实链接 */
    var jump = el.getAttribute('data-jump');
    if (jump) {
      var url = el.getAttribute('data-url');
      if (url) { window.open(url, '_blank'); }
      else {
        WB.toast('需要填入真实链接才可跳转：请在源码 assets/js/data.js 的 WB.LINKS 中填入 url', 'err');
      }
      return;
    }

    if (act === 'goto') { WB.goto(el.getAttribute('data-sec')); return; }

    /* ---- 🧺 今日清单三分页 ---- */
    if (act === 'plan-tab') { WB.planTab = el.getAttribute('data-tab'); render(); return; }

    /* 今日清单里勾选的是你自己的任务，判定与各板块一致：有勾选或填了数值都算完成。
       只做局部刷新，避免整页重绘让页面跳回顶部。 */
    if (act === 'toggle-plan') {
      var plog2 = WB.getLog(cur.date, id) || {};
      var pdone = !!(plog2.done || (plog2.value !== '' && plog2.value != null));
      WB.setLog(cur.date, id, { done: !pdone });
      patchPlanUI();
      return;
    }

    if (act === 'reroll-plans') {
      WB.rerollPlans(cur.date); WB.toast('已换一批，新的一天六条 ✨'); render(); return;
    }

    if (act === 'claim-plan-coin') {
      var gotN = WB.grantCoin('today-all', cur.date);
      if (gotN > 0) WB.toast('🎉 全勤奖励 +' + gotN + ' 金币已到账', 'ok');
      else WB.toast('今天已领过或金币已达上限啦', 'err');
      render(); return;
    }

    if (act === 'add-weekplan') {
      var wpT = document.getElementById('wpTitle'), wpD = document.getElementById('wpDay');
      if (!wpT || !wpT.value.trim()) { WB.toast('先写点内容吧', 'err'); return; }
      WB.addWeekPlan({ title: wpT.value.trim(), day: wpD ? wpD.value : '', date: cur.date });
      WB.toast('已加入本周计划', 'ok'); render(); return;
    }
    if (act === 'toggle-weekplan') { WB.toggleWeekPlan(id); render(); return; }
    if (act === 'del-weekplan') { WB.removeWeekPlan(id); render(); return; }

    if (act === 'add-goal') {
      var gT = document.getElementById('goalTitle'), gDead = document.getElementById('goalDeadline');
      if (!gT || !gT.value.trim()) { WB.toast('请填写目标名称', 'err'); return; }
      WB.addGoal({ title: gT.value.trim(), deadline: gDead ? gDead.value : '', progress: 0 });
      WB.toast('目标已添加，拖动滑块调整进度吧 🎯', 'ok'); render(); return;
    }
    if (act === 'del-goal') {
      WB.confirm('删除目标', '确定删除这个长期目标？').then(function (ok) {
        if (ok) { WB.removeGoal(id); WB.toast('已删除'); render(); }
      });
      return;
    }

    /* ---- 💡 灵感速记 ---- */
    if (act === 'save-idea') {
      var ib = document.getElementById('ideaInput');
      if (!ib || !ib.value.trim()) { WB.toast('写点什么再存吧', 'err'); return; }
      var lines = ib.value.trim().split('\n');
      WB.addEntry({
        section: 'today', type: 'idea', date: cur.date,
        title: lines[0].slice(0, 40), body: ib.value.trim(), tag: '灵感'
      });
      WB.toast('已存入灵感库，同步到随笔专区 ✨', 'ok'); render(); return;
    }

    /* ---- 🎮 金币 & 心愿 ---- */
    if (act === 'add-wish') {
      var wT = document.getElementById('wishTitle'), wC = document.getElementById('wishCost');
      if (!wT || !wT.value.trim()) { WB.toast('填写你想奖励自己的东西', 'err'); return; }
      var cost = parseInt(wC && wC.value, 10) || 0;
      if (cost <= 0) { WB.toast('填写需要的金币数', 'err'); return; }
      WB.addWish({ title: wT.value.trim(), cost: cost });
      WB.toast('心愿已添加，攒金币去 🎀', 'ok'); render(); return;
    }
    if (act === 'redeem-wish') {
      var wish = WB.state.wishes.filter(function (x) { return x.id === id; })[0];
      if (!wish) return;
      WB.confirm('兑换心愿', '用 ' + wish.cost + ' 金币兑换「' + wish.title + '」？\n金币余额将相应减少，可在流水中查看记录。').then(function (ok) {
        if (!ok) return;
        if (WB.redeemWish(id, cur.date)) { WB.toast('兑换成功，好好享受奖励 🎁', 'ok'); render(); }
        else WB.toast('金币不够或已兑换过', 'err');
      });
      return;
    }
    if (act === 'del-wish') { WB.removeWish(id); render(); return; }

    /* ---- 复盘：带入当日真实数据 ---- */
    if (act === 'auto-progress') {
      var ta = view.querySelector('[data-field="progress"]');
      if (ta) {
        ta.value = WB.autoProgressText(cur.date);
        WB.setDraft('review|' + cur.date, 'progress', ta.value);
        WB.toast('已带入当日真实数据 📊', 'ok');
      }
      return;
    }

    /* ---- 重要新闻：切换分类 / 刷新 / 存档 / 重试图表 ---- */
    if (act === 'news-tab') {
      WB.newsState.cat = el.getAttribute('data-cat');
      Array.prototype.forEach.call(view.querySelectorAll('[data-act="news-tab"]'), function (b) {
        b.classList.toggle('on', b.getAttribute('data-cat') === WB.newsState.cat);
      });
      WB.newsPaint();
      WB.newsFetch(WB.newsState.cat).then(function () { WB.newsPaint(); });
      return;
    }

    if (act === 'news-refresh') {
      WB.newsFetch(WB.newsState.cat, true).then(function () { WB.newsPaint(); });
      WB.toast('正在重新拉取…');
      return;
    }

    if (act === 'save-news') {
      var ni = WB.newsItem(el.getAttribute('data-cat'), +el.getAttribute('data-i'));
      if (!ni) return;
      WB.addEntry({
        section: 'news', type: 'news', date: cur.date, title: ni.title,
        body: ni.desc || '', tag: ni.source || '资讯',
        meta: { source: ni.link || '', time: ni.time || '' }
      });
      WB.toast('已存入新闻存档', 'ok');
      return;
    }

    if (act === 'retry-charts') {
      WB.buildReviewCharts(cur.date);
      WB.toast('正在重新加载图表…');
      return;
    }

    if (act === 'archive-weekly') {
      var wk = WB.weekDates(cur.date)[0];
      var txt = WB.getDraft('weekly|' + wk, 'self');
      if (!txt) { WB.toast('还没写本周自评', 'err'); return; }
      WB.addEntry({ section: 'review', type: 'weekly', date: cur.date, title: '本周自评 · ' + wk + ' 起', body: txt, tag: '周复盘' });
      WB.toast('本周自评已归档', 'ok'); render(); return;
    }

    if (act === 'toggle-task') {
      var l = WB.getLog(cur.date, id) || {};
      WB.setLog(cur.date, id, { done: !l.done });
      render(); return;
    }

    if (act === 'del-task') {
      var t = WB.getTask(id);
      WB.confirm('删除任务', '确定删除「' + (t ? t.title : '') + '」？其历史打卡记录也会一并移除。').then(function (ok) {
        if (ok) { WB.removeTask(id); WB.toast('已删除'); render(); }
      });
      return;
    }

    if (act === 'add-task') { addTaskFrom(el.closest('[data-scope="addtask"]')); return; }

    if (act === 'add-entry') { addEntryFrom(el.closest('[data-scope="addentry"]')); return; }

    if (act === 'del-entry') {
      WB.confirm('删除记录', '确定删除这条记录？删除后不可恢复。').then(function (ok) {
        if (ok) { WB.removeEntry(id); WB.toast('已删除'); render(); }
      });
      return;
    }

    if (act === 'save-body') {
      var scope = el.closest('.card-b') || view;
      var meta = {};
      scope.querySelectorAll('[data-bf]').forEach(function (i) { meta[i.getAttribute('data-bf')] = i.value.trim(); });
      var exist = WB.entriesOf('fitness', 'body').filter(function (x) { return x.date === cur.date; })[0];
      if (exist) {
        exist.meta = meta; exist.ts = new Date().toISOString(); WB.save();
      } else {
        WB.addEntry({ section: 'fitness', type: 'body', date: cur.date, title: '身体状态 · ' + cur.date, body: '', meta: meta });
      }
      WB.toast('身体状态已保存', 'ok');
      render(); return;
    }

    if (act === 'save-sentence') {
      var s = WB.SENTENCES[+el.getAttribute('data-idx')];
      WB.addEntry({ section: 'english', type: 'sentence', date: cur.date, title: s.en, body: s.zh, tag: '好句' });
      WB.toast('已收藏进句库', 'ok'); render(); return;
    }

    if (act === 'read-done') {
      WB.setLog(cur.date, 'eng-oral', { done: true, note: '已跟读' });
      WB.toast('已标记跟读', 'ok'); render(); return;
    }

    if (act === 'save-point') {
      var gp = WB.GUIDE_POINTS[+el.getAttribute('data-idx')];
      WB.addEntry({ section: 'guide', type: 'point', date: cur.date, title: gp.q, body: gp.a, tag: gp.cat });
      WB.toast('已存入重点', 'ok'); render(); return;
    }

    if (act === 'random-point') {
      var i = Math.floor(Math.random() * WB.GUIDE_POINTS.length);
      var p = WB.GUIDE_POINTS[i];
      var box = view.querySelector('.knowledge');
      if (box) {
        box.innerHTML = '<div class="k-lab">' + WB.esc(p.cat) + '</div><div class="k-q">' + WB.esc(p.q) + '</div><div class="k-a">' + WB.esc(p.a) + '</div>';
        var btn = view.querySelector('[data-act="save-point"]');
        if (btn) btn.setAttribute('data-idx', i);
      }
      return;
    }

    if (act === 'archive-review') {
      var sc = 'review|' + cur.date;
      var parts = WB.REVIEW_FIELDS.map(function (f) {
        var v = WB.getDraft(sc, f.k);
        return v ? '【' + f.t + '】\n' + v : '';
      }).filter(Boolean);
      if (!parts.length) { WB.toast('还没有填写内容', 'err'); return; }
      WB.addEntry({ section: 'review', type: 'review', date: cur.date, title: '每日复盘 · ' + cur.date, body: parts.join('\n\n'), tag: '复盘' });
      WB.toast('复盘已归档', 'ok'); render(); return;
    }

    if (act === 'add-channel') {
      var inp = document.getElementById('chInput');
      var v = inp.value.trim();
      if (!v) return;
      if (!WB.state.settings.newsChannels) WB.state.settings.newsChannels = WB.NEWS_CHANNELS.slice();
      WB.state.settings.newsChannels.push(v);
      WB.save(); inp.value = ''; render(); return;
    }

    if (act === 'del-channel') {
      var idx = +el.getAttribute('data-i');
      if (!WB.state.settings.newsChannels) WB.state.settings.newsChannels = WB.NEWS_CHANNELS.slice();
      WB.state.settings.newsChannels.splice(idx, 1);
      WB.save(); render(); return;
    }

    if (act === 'kw-tag') {
      WB.kwQuery = el.getAttribute('data-tag'); render();
      var s2 = document.getElementById('kwSearch'); if (s2) s2.focus();
      return;
    }
    if (act === 'clear-kw') { WB.kwQuery = ''; render(); return; }
    if (act === 'clear-hist') { WB.histQuery = ''; WB.histSection = ''; WB.histFrom = ''; WB.histTo = ''; render(); return; }
    if (act === 'export') { WB.exportJSON(); WB.toast('已导出备份文件', 'ok'); return; }
  });

  /* 输入 / 变更 */
  function onInput(e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');

    if (act === 'log-value') { WB.setLog(cur.date, id, { value: el.value }); return; }
    if (act === 'log-note') { WB.setLog(cur.date, id, { note: el.value }); return; }
    if (act === 'plan-note') { WB.setLog(cur.date, id, { note: el.value }); return; }

    /* 长期目标：拖动进度条时局部刷新，避免整页重绘导致拖动中断 */
    if (act === 'goal-range') {
      WB.setGoalProgress(id, el.value);
      var glbl = view.querySelector('[data-goal-label="' + id + '"]');
      if (glbl) glbl.textContent = el.value + '%';
      var gbar = view.querySelector('[data-goal-bar="' + id + '"]');
      if (gbar) gbar.style.width = el.value + '%';
      if (WB.refreshGoalStats) WB.refreshGoalStats();
      return;
    }

    if (act === 'setting') {
      WB.state.settings[el.getAttribute('data-key')] = el.value; WB.save(); render(); return;
    }

    if (act === 'search-points') {
      var box = document.getElementById('pointList');
      if (box) box.innerHTML = WB.pointListHTML(el.value.trim());
      return;
    }

    if (act === 'search-kw') {
      WB.kwQuery = el.value;
      var v = el.value;
      render();
      var s = document.getElementById('kwSearch');
      if (s) { s.focus(); s.setSelectionRange(v.length, v.length); }
      return;
    }

    if (act === 'search-hist') {
      WB.histQuery = el.value;
      var v2 = el.value;
      render();
      var s2 = document.getElementById('histSearch');
      if (s2) { s2.focus(); s2.setSelectionRange(v2.length, v2.length); }
      return;
    }
  }
  view.addEventListener('input', onInput);

  view.addEventListener('change', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'log-value') {
      var vid = el.getAttribute('data-id');
      WB.setLog(cur.date, vid, { value: el.value });
      if (el.value !== '') WB.setLog(cur.date, vid, { done: true });

      /* 今日清单里填数值：只做局部更新，避免整页重绘打断输入 */
      var pitem = el.closest('.plan-item');
      if (pitem) { patchPlanUI(); return; }
      render(); return;
    }
    if (act === 'log-note') { WB.setLog(cur.date, el.getAttribute('data-id'), { note: el.value }); return; }
    if (act === 'setting') { WB.state.settings[el.getAttribute('data-key')] = el.value; WB.save(); render(); return; }
    if (act === 'filter-sec') { WB.histSection = el.value; render(); return; }
    if (act === 'filter-from') { WB.histFrom = el.value; render(); return; }
    if (act === 'filter-to') { WB.histTo = el.value; render(); return; }
  });

  /* 复盘类长文本自动保存 */
  var asTimer = null;
  view.addEventListener('input', function (e) {
    var el = e.target.closest('[data-as]');
    if (!el) return;
    var scope = el.getAttribute('data-scope');
    var k = el.getAttribute('data-as');
    var v = el.value;
    clearTimeout(asTimer);
    asTimer = setTimeout(function () {
      WB.setDraft(scope, k, v);
      /* 周评文本框统一用 weekly 作为提示标记 */
      var fk = scope.indexOf('weekly') === 0 ? 'weekly' : k;
      var flag = view.querySelector('[data-flag="' + fk + '"]');
      if (flag) { flag.classList.add('on'); setTimeout(function () { flag.classList.remove('on'); }, 1200); }
    }, 400);
  });
  view.addEventListener('change', function (e) {
    var el = e.target.closest('[data-as]');
    if (!el) return;
    WB.setDraft(el.getAttribute('data-scope'), el.getAttribute('data-as'), el.value);
  });

  /* ---------------- 启动 ---------------- */
  cur.section = WB.state.meta.lastSection || 'today';
  if (!WB.render[cur.section]) cur.section = 'today';
  datePicker.value = cur.date;
  render();

  /* 启动页：每天首次打开问候你一次，点「开始今天」进入 */
  if (WB.maybeSplash) WB.maybeSplash();

  if (WB.storageFallback) {
    setTimeout(function () {
      WB.toast('当前环境无法写入本地存储，数据仅本次有效，请及时「导出备份」或用浏览器直接打开', 'err');
    }, 600);
  }
})();

</script>
</body>
</html>
